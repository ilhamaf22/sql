<style>
/* Layout: berkas kasus — peta materi per bab di atas, map arsip di kiri (cerita, tugas, konsep), meja kerja di kanan (kuis/editor, hasil, ERD), buku catatan kesalahan di bawah */
:root{
  --paper:#ECEFE6; --card:#F8F9F4; --well:#E2E6DA; --ink:#1D2939; --muted:#5B6862; --line:#C9D0C1;
  --stamp:#B2352B; --stamp-soft:#F3DCD7; --ok:#2C7A4C; --ok-soft:#DCEEDF; --warn:#9A6210; --warn-soft:#F4E7CF;
  --tab:#D8DECD; --key:#2F5D8A;
  --f-display:"Zilla Slab", "Rockwell", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#12181A; --card:#1A2225; --well:#0F1416; --ink:#E3E8DE; --muted:#97A39D; --line:#2D383B;
  --stamp:#E56A5E; --stamp-soft:#3A2220; --ok:#62C08B; --ok-soft:#1C3326; --warn:#DDA748; --warn-soft:#352A16;
  --tab:#232D30; --key:#7FB0DF; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#12181A; --card:#1A2225; --well:#0F1416; --ink:#E3E8DE; --muted:#97A39D; --line:#2D383B;
  --stamp:#E56A5E; --stamp-soft:#3A2220; --ok:#62C08B; --ok-soft:#1C3326; --warn:#DDA748; --warn-soft:#352A16;
  --tab:#232D30; --key:#7FB0DF; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
code,.mono{font-family:var(--f-mono);font-size:.88em}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.label{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:6px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--well);filter:none}
.btn.red{background:var(--stamp);border-color:var(--stamp);color:#fff}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.kbd{font-family:var(--f-mono);font-size:.72rem;opacity:.75;border:1px solid currentColor;border-radius:4px;padding:0 5px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:700}
.top .case-no{font-family:var(--f-mono);font-size:.8rem;color:var(--stamp);font-weight:600;letter-spacing:.06em}
.top .meta{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.top .meta b{color:var(--ink)}

.map{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.map summary{font-weight:700}
.map summary span{font-weight:400;color:var(--muted);font-size:.88rem;margin-left:8px}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 20px;margin-top:14px}
.ch{min-width:0;display:flex;flex-direction:column;gap:6px}
.ch .t{font-family:var(--f-display);font-weight:600;font-size:1rem;display:flex;gap:8px;align-items:baseline}
.ch .t .no{font-family:var(--f-mono);font-size:.74rem;color:var(--stamp)}
.ch .t .pc{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-weight:400}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:30px;height:26px;border-radius:4px;border:1.5px solid var(--line);background:var(--paper);font-family:var(--f-mono);font-size:.72rem;color:var(--muted);padding:0}
.dot:hover{border-color:var(--ink);color:var(--ink)}
.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.helped{background:var(--warn);border-color:var(--warn);color:#fff}
.dot.tried{border-color:var(--stamp);color:var(--stamp)}
.dot.now{outline:2.5px solid var(--ink);outline-offset:1px;color:var(--ink)}
.dot.now.done,.dot.now.helped{color:#fff}

.game{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
@media (max-width:920px){.game{grid-template-columns:minmax(0,1fr)}}

.folder{position:relative;background:var(--card);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:22px 22px 20px;margin-top:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.folder::before{content:attr(data-tab);position:absolute;left:-1px;top:-24px;height:24px;max-width:calc(100% + 2px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:3px 14px 0;background:var(--tab);border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;font-family:var(--f-mono);font-size:.72rem;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.folder h2{font-size:1.55rem}
.folder.solved h2{padding-right:110px}
.story em{font-style:normal;background:var(--warn-soft);padding:0 3px;border-radius:3px}
.task{border-left:4px solid var(--stamp);background:var(--stamp-soft);padding:12px 14px;border-radius:0 6px 6px 0}
.task p{font-weight:700}
.concept{background:var(--well);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.concept pre{margin:0;font-family:var(--f-mono);font-size:.82rem;white-space:pre;color:var(--ink);overflow-x:auto}
.hints{display:flex;flex-direction:column;gap:8px}
.hints:empty{display:none}
.hint{font-size:.94rem;padding:8px 12px;border:1px dashed var(--warn);border-radius:6px;background:var(--warn-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.stampmark{position:absolute;right:16px;top:16px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.08em;color:var(--ok);border:3px solid var(--ok);border-radius:6px;padding:3px 10px;transform:rotate(-8deg);background:var(--card);pointer-events:none}
.stampmark.helped{color:var(--warn);border-color:var(--warn)}
.stampmark.anim{animation:thump .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes thump{0%{transform:rotate(-8deg) scale(2.2);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stampmark.anim{animation:none}}

.desk{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
details.panel{display:block}
details.panel > * + *{margin-top:12px}
.erd{overflow-x:auto}
.erd svg{display:block;width:100%;min-width:640px;height:auto}
.erd .box{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.erd .hdr{fill:var(--tab)}
.erd .tn{font-family:var(--f-mono);font-weight:600;font-size:12.5px;fill:var(--ink)}
.erd .cn{font-family:var(--f-mono);font-size:11.5px;fill:var(--ink)}
.erd .pk{font-family:var(--f-mono);font-size:10px;font-weight:600;fill:var(--stamp)}
.erd .fk{font-family:var(--f-mono);font-size:10px;font-weight:600;fill:var(--key)}
.erd .rel{fill:none;stroke:var(--muted);stroke-width:1.5}
.erd .card{font-family:var(--f-mono);font-size:12px;font-weight:600;fill:var(--ink)}
.legend{font-size:.82rem;color:var(--muted)}
.legend b.pk{color:var(--stamp)} .legend b.fk{color:var(--key)}

.schema{display:flex;flex-wrap:wrap;gap:8px}
.tbl{border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:8px 10px;min-width:0;font-size:.82rem}
.tbl button{border:none;background:none;padding:0;color:var(--ink);font-family:var(--f-mono);font-weight:600;font-size:.85rem;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.tbl button:hover{text-decoration-color:var(--stamp)}
.cols{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cols button{font-weight:400;font-size:.76rem;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.cols button:hover{color:var(--ink);border-color:var(--ink)}
.cols button.k{color:var(--stamp);border-color:var(--stamp)}
.cols button.f{color:var(--key);border-color:var(--key)}
textarea{width:100%;min-height:150px;resize:vertical;font-family:var(--f-mono);font-size:.95rem;line-height:1.6;color:var(--ink);background:var(--well);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;tab-size:2}
textarea:focus{border-color:var(--ink);outline:none}
.target{font-size:.85rem;color:var(--muted)}
.target b{color:var(--ink);font-variant-numeric:tabular-nums}

.quiz .q{font-weight:700;font-size:1.08rem}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .l{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.opt.wrong{border-color:var(--stamp);background:var(--stamp-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt:disabled{cursor:default}

.feedback{border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.feedback.bad{background:var(--stamp-soft);border:1px solid var(--stamp)}
.feedback.good{background:var(--ok-soft);border:1px solid var(--ok)}
.feedback .head{font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.feedback .cat{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.04em;padding:1px 7px;border-radius:4px;background:var(--stamp);color:#fff}
.feedback.good .cat{background:var(--ok)}
.feedback .raw{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);word-break:break-word}

.result{overflow:auto;max-height:320px;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--tab);font-family:var(--f-mono);font-weight:600;font-size:.76rem}
td.null{color:var(--muted);font-style:italic}
.empty{padding:14px;color:var(--muted);font-size:.9rem}

.notebook{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.notebook h3{font-size:1.15rem;display:flex;gap:10px;align-items:baseline}
.notebook h3 .count{font-family:var(--f-mono);font-size:.85rem;color:var(--stamp)}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.mlist li{display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:4px 12px;padding:8px 10px;border-radius:6px;background:var(--paper);font-size:.86rem}
.mlist .lv{font-family:var(--f-mono);color:var(--stamp);font-weight:600}
.mlist .q{grid-column:2;font-family:var(--f-mono);font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.cover{background:var(--card);border:1px solid var(--line);border-radius:0 10px 10px 10px;position:relative;margin-top:26px;padding:clamp(22px,5vw,48px);display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:32px}
.cover::before{content:"BERKAS 07 / KOPERASI BUKIT DUA";position:absolute;left:-1px;top:-26px;height:26px;padding:4px 16px 0;background:var(--tab);border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;font-family:var(--f-mono);font-size:.74rem;font-weight:600;letter-spacing:.06em;color:var(--muted)}
@media (max-width:820px){.cover{grid-template-columns:minmax(0,1fr)}}
.cover h2{font-size:clamp(2rem,5vw,3.1rem);font-weight:700}
.cover .lead{font-size:1.08rem;max-width:60ch}
.syll{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.syll li{border-top:2px solid var(--line);padding-top:6px;font-size:.88rem;color:var(--muted)}
.syll li b{display:block;font-family:var(--f-display);font-size:1.02rem;color:var(--ink)}
.syll li .no{font-family:var(--f-mono);font-size:.72rem;color:var(--stamp)}
.secret{display:inline-block;font-family:var(--f-display);font-weight:700;letter-spacing:.14em;color:var(--stamp);border:3px solid var(--stamp);padding:2px 12px;transform:rotate(-4deg);border-radius:4px;align-self:flex-start}
.how{background:var(--paper);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);align-self:start}
.how ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}

.eval{display:flex;flex-direction:column;gap:20px}
.verdict{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:clamp(20px,4vw,36px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:600px){.verdict{grid-template-columns:minmax(0,1fr)}}
.grade{font-family:var(--f-display);font-weight:700;font-size:5.5rem;line-height:1;color:var(--stamp);border:5px solid var(--stamp);border-radius:12px;width:8.5rem;height:8.5rem;display:grid;place-items:center;transform:rotate(-5deg)}
.verdict h2{font-size:clamp(1.6rem,4vw,2.3rem)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.stat .v{font-family:var(--f-display);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr) 3rem;gap:10px;align-items:center;font-size:.86rem}
.bar .track2{height:14px;background:var(--well);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--ink);border-radius:3px}
.bar.top .fill{background:var(--stamp)}
.bar .fill.g{background:var(--ok)} .bar .fill.y{background:var(--warn)} .bar .fill.r{background:var(--stamp)}
.bar .num{font-family:var(--f-mono);text-align:right}
@media (max-width:480px){.bar{grid-template-columns:minmax(0,1fr) 3rem}.bar .track2{grid-column:1 / -1;grid-row:2}}
.recs{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:10px}
details summary{cursor:pointer;font-weight:700}
.st-ok{color:var(--ok);font-weight:700}.st-help{color:var(--warn);font-weight:700}.st-no{color:var(--muted)}
.loading{padding:40px;text-align:center;color:var(--muted)}
.credits{max-width:1240px;margin:32px auto 0;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:.86rem;color:var(--muted)}
.credits nav{display:flex;flex-wrap:wrap;gap:8px 18px}
.credits a{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.credits a:hover{text-decoration-color:var(--stamp)}
.promo{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.promo a{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);text-decoration:none;min-width:0}
.promo a:hover{border-color:var(--ink)}
.promo a:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.promo .k{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--stamp);font-weight:600}

.promo span.d{font-size:.88rem;color:var(--muted)}
.promo .go{font-size:.85rem;font-weight:700;margin-top:auto}
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:10px 14px;font-size:.92rem}
.banner.exam{background:var(--stamp-soft);border-color:var(--stamp)}
.sol{border-top:1px dashed var(--ok);padding-top:8px;margin-top:4px}
.sol summary{font-size:.92rem}
.sol pre{margin:4px 0 8px;font-family:var(--f-mono);font-size:.8rem;white-space:pre-wrap;word-break:break-word;background:var(--card);border-radius:4px;padding:8px 10px}
.sol .label{display:block;margin-top:8px}
</style>

<body>
<div class="wrap" id="app"><div class="loading">Menyiapkan database penyelidikan…</div></div>
<footer class="credits" id="credits"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-asm.js"></script>
<script>
/* ===================== TAUTAN PEMBUAT =====================
   Isi alamat lengkap (https://…). Tautan yang kosong otomatis disembunyikan. */
const LINKS = {
  saweria:  '',
  pynoir:   '',
  linkedin: 'https://www.linkedin.com/in/ilhamalifianf',
};
const LINK_INFO = [
  {key:'pynoir',   k:'Game lain',    t:'PyNoir',           d:'Belajar Python lewat kasus detektif, dari dasar sampai mahir.', go:'Main PyNoir'},
  {key:'saweria',  k:'Dukung',       t:'Traktir di Saweria', d:'Kalau game ini membantumu belajar, dukung pembuatan kasus berikutnya.', go:'Buka Saweria'},
  {key:'linkedin', k:'Pembuat',      t:'Ilham di LinkedIn', d:'Konten rutin seputar data, visualisasi, dan analisis.', go:'Terhubung di LinkedIn'},
];
const activeLinks = () => LINK_INFO.filter(l => /^https?:\/\//.test(LINKS[l.key]||''));
function renderCredits(){
  const f=document.getElementById('credits'); if(!f) return;
  const ls=activeLinks();
  f.innerHTML = `<span>Kasus Kopi Hilang · dibuat oleh Ilham. Semua nama dan data dalam game ini fiktif.</span>

  explain:`Normalisasi adalah cara merancang tabel agar setiap fakta disimpan di satu tempat saja. Data yang diulang di banyak tempat mudah tidak sinkron: kalau warga pindah rumah, salinan alamat di tabel lain bisa lupa diperbarui. Aturan dasarnya: satu sel berisi satu nilai, satu tabel membahas satu hal, dan tabel lain cukup merujuk lewat foreign key.`,

  q:`Kenapa alamat pemilik sebaiknya tidak disimpan langsung di tabel kendaraan?`,

/* ---------- BAB 3: MENYARING DATA ---------- */
{ ch:'saring', concept:'WHERE', title:'Hanya kasus pencurian',
  story:`Koperasi Bukit Dua melapor kehilangan. Mulailah dengan mengumpulkan semua laporan pencurian.`,
  task:`Tampilkan semua kolom laporan_polisi yang jenisnya Pencurian.`,
  explain:`WHERE menyaring baris. Hanya baris yang memenuhi syarat yang ditampilkan. Teks ditulis di dalam tanda kutip tunggal, dan huruf besar-kecilnya harus persis sama dengan data.`,
  example:`SELECT * FROM tabel WHERE kolom = 'nilai';`,
  hints:[`WHERE jenis = '…'`,`WHERE jenis = 'Pencurian' (huruf P besar).`],
  solution:`SELECT * FROM laporan_polisi WHERE jenis = 'Pencurian';`,
  require:[/\bwhere\b/i], requireMsg:`Saring dengan WHERE, jangan memilih baris lewat id satu per satu.` },

{ ch:'saring', concept:'AND', title:'Laporan yang tepat',
  story:`Ada tiga pencurian, tapi satu terjadi di Kota Bukit dan satu lagi di tanggal lain.`,
  task:`Cari laporan berjenis Pencurian, di Kota Lembah, pada tanggal 2026-10-12. Tampilkan semua kolom.`,
  explain:`AND menggabungkan beberapa syarat. Baris hanya lolos jika memenuhi semua syarat. Tanggal juga ditulis dalam kutip tunggal.`,
  example:`WHERE syarat1
  AND syarat2
  AND syarat3`,
  hints:[`Ada tiga syarat: jenis, kota, dan tanggal.`,`WHERE jenis = 'Pencurian' AND kota = 'Kota Lembah' AND tanggal = '2026-10-12'`],
  solution:`SELECT * FROM laporan_polisi WHERE jenis='Pencurian' AND kota='Kota Lembah' AND tanggal='2026-10-12';`,
  require:[/\band\b/i], requireMsg:`Gabungkan syaratnya dengan AND.` },

{ ch:'saring', concept:'Operator perbandingan', title:'Kerugian besar',
  story:`Kepala Penyidik minta daftar kasus dengan kerugian besar untuk diprioritaskan.`,
  task:`Tampilkan id, jenis, dan kerugian dari laporan yang kerugiannya lebih dari 2000000.`,
  explain:`Operator perbandingan: = (sama), <> (tidak sama), > (lebih dari), < (kurang dari), >= dan <=. Angka ditulis tanpa kutip dan tanpa titik ribuan.`,
  example:`WHERE kerugian >= 1000000`,
  hints:[`Pakai tanda > dan angka tanpa titik: 2000000`,`SELECT id, jenis, kerugian FROM laporan_polisi WHERE kerugian > 2000000;`],
  solution:`SELECT id, jenis, kerugian FROM laporan_polisi WHERE kerugian > 2000000;` },

{ ch:'saring', concept:'OR & IN', title:'Yang dekat dengan kopi',
  story:`Orang yang paham jual-beli kopi bisa menjual hasil curian dengan cepat. Kumpulkan para petani kopi dan pedagang.`,
  task:`Tampilkan nama dan pekerjaan warga yang pekerjaannya Petani kopi atau Pedagang.`,
  explain:`OR meloloskan baris yang memenuhi salah satu syarat. IN adalah cara singkat untuk banyak OR pada kolom yang sama. Hati-hati mencampur AND dan OR: AND dikerjakan lebih dulu, jadi beri tanda kurung bila perlu.`,
  example:`WHERE kota = 'A' OR kota = 'B'
-- sama dengan
WHERE kota IN ('A', 'B')`,
  hints:[`WHERE pekerjaan IN ('…', '…')`,`WHERE pekerjaan IN ('Petani kopi', 'Pedagang')`],
  solution:`SELECT nama, pekerjaan FROM warga WHERE pekerjaan IN ('Petani kopi','Pedagang');`,
  require:[/\bin\s*\(|\bor\b/i], requireMsg:`Gunakan IN atau OR.` },

{ ch:'saring', concept:'BETWEEN', title:'Seputar hari kejadian',
  story:`Pelaku kadang membuat masalah lain di hari-hari sekitar kejadian. Periksa semua laporan dalam rentang waktu itu.`,
  task:`Tampilkan id, tanggal, dan jenis laporan dari tanggal 2026-10-10 sampai 2026-10-15.`,
  explain:`BETWEEN a AND b memilih nilai dari a sampai b, termasuk kedua ujungnya. Bisa dipakai untuk angka maupun tanggal berformat 'YYYY-MM-DD'.`,
  example:`WHERE tanggal BETWEEN '2026-01-01' AND '2026-01-31'`,
  hints:[`WHERE tanggal BETWEEN '…' AND '…'`,`WHERE tanggal BETWEEN '2026-10-10' AND '2026-10-15'`],
  solution:`SELECT id, tanggal, jenis FROM laporan_polisi WHERE tanggal BETWEEN '2026-10-10' AND '2026-10-15';` },

{ ch:'saring', concept:'WHERE pada FK', title:'Suara para saksi',
  story:`Kesaksian untuk tiap laporan disimpan di tabel penghubung <code>saksi</code>. Laporan pencurian kopi punya id 3.`,
  task:`Tampilkan warga_id dan keterangan dari tabel saksi untuk laporan_id 3.`,
  explain:`Foreign key bisa langsung dipakai untuk menyaring. laporan_id = 3 berarti "semua kesaksian untuk laporan nomor 3".`,
  example:`SELECT kolom1, kolom2 FROM saksi WHERE laporan_id = 3;`,
  hints:[`Angka tidak perlu kutip: laporan_id = 3`,`SELECT warga_id, keterangan FROM saksi WHERE laporan_id = 3;`],

{ ch:'saring', concept:'LIKE', title:'Pikap hijau berplat DB 8',
  story:`Para saksi menyebut <em>mobil hijau</em> dan plat yang <em>diawali DB 8</em>.`,
  task:`Cari kendaraan berwarna Hijau yang no_plat-nya diawali 'DB 8'. Tampilkan semua kolom.`,
  explain:`LIKE mencocokkan pola teks. Tanda % berarti "karakter apa saja, berapa pun panjangnya", dan _ berarti tepat satu karakter. 'DB 8%' cocok dengan semua teks yang diawali DB 8.`,
  example:`WHERE nama LIKE 'R%'      -- diawali R
WHERE nama LIKE '%an'     -- diakhiri an
WHERE nama LIKE '%kopi%'  -- mengandung kopi`,
  hints:[`no_plat LIKE 'DB 8%'`,`Tambah syarat kedua: AND warna = 'Hijau'`],
  solution:`SELECT * FROM kendaraan WHERE warna='Hijau' AND no_plat LIKE 'DB 8%';`,
  require:[/\blike\b/i], requireMsg:`Level ini melatih LIKE. Gunakan LIKE dengan tanda %.` },

{ ch:'saring', concept:'IS NULL', title:'Kerugian yang belum dihitung',
  story:`Bagian keuangan menanyakan laporan yang nilai kerugiannya masih kosong.`,
  task:`Tampilkan id dan jenis laporan yang kerugiannya belum tercatat (NULL).`,
  explain:`NULL tidak bisa dibandingkan dengan =. Hasil kerugian = NULL selalu "tidak diketahui", sehingga tidak ada baris yang lolos. Gunakan IS NULL atau IS NOT NULL.`,
  example:`WHERE kolom IS NULL
WHERE kolom IS NOT NULL`,
  hints:[`Jangan pakai = NULL.`,`WHERE kerugian IS NULL`],
  solution:`SELECT id, jenis FROM laporan_polisi WHERE kerugian IS NULL;`,
  require:[/\bis\s+null\b/i], requireMsg:`Gunakan IS NULL.` },

/* ---------- BAB 4: MENGURUTKAN & MERINGKAS ---------- */
{ ch:'ringkas', concept:'ORDER BY', title:'Kronologi hari kejadian',
  story:`Gudang punya buku tamu digital, tabel <code>log_gudang</code>. Susun siapa saja yang masuk pada hari pencurian.`,
  task:`Tampilkan semua kolom log_gudang untuk tanggal 2026-10-12, diurutkan menurut jam_masuk dari yang paling awal.`,
  explain:`ORDER BY mengurutkan hasil. Bawaannya naik (ASC). Tulis DESC untuk urutan turun. ORDER BY ditulis setelah WHERE. Tanpa ORDER BY, urutan hasil tidak dijamin.`,
  example:`SELECT * FROM tabel
WHERE ...
ORDER BY kolom ASC;`,
  hints:[`Urutannya: SELECT … FROM … WHERE … ORDER BY …`,`ORDER BY jam_masuk`],
  solution:`SELECT * FROM log_gudang WHERE tanggal='2026-10-12' ORDER BY jam_masuk;`,
  orderMatters:true, require:[/\border\s+by\b/i], requireMsg:`Gunakan ORDER BY agar urutannya pasti.` },

{ ch:'ringkas', concept:'DESC + LIMIT', title:'Tiga kasus terbesar',
  story:`Untuk rapat koordinasi, atasan hanya mau tiga kasus dengan kerugian terbesar.`,
  task:`Tampilkan id, jenis, dan kerugian dari 3 laporan dengan kerugian terbesar, urut dari yang terbesar.`,
  explain:`Gabungkan ORDER BY … DESC dengan LIMIT untuk mengambil "n teratas". Urutan klausa: WHERE, ORDER BY, lalu LIMIT.`,
  example:`SELECT * FROM tabel
ORDER BY nilai DESC
LIMIT 5;`,
  hints:[`ORDER BY kerugian DESC`,`Tambahkan LIMIT 3 di paling akhir.`],
  solution:`SELECT id, jenis, kerugian FROM laporan_polisi ORDER BY kerugian DESC LIMIT 3;`,
  orderMatters:true, require:[/\bdesc\b/i,/\blimit\b/i], requireMsg:`Gunakan ORDER BY … DESC dan LIMIT.` },

{ ch:'ringkas', concept:'COUNT', title:'Berapa banyak laporan?',
  story:`Wali kota bertanya: berapa laporan yang masuk dari Kota Lembah bulan ini?`,
  task:`Hitung jumlah laporan di laporan_polisi yang kotanya Kota Lembah. Hasilnya satu angka.`,
  explain:`COUNT(*) menghitung jumlah baris. Fungsi seperti ini disebut fungsi agregat: ia meringkas banyak baris menjadi satu nilai. COUNT(kolom) hanya menghitung baris yang kolomnya tidak NULL.`,
  example:`SELECT COUNT(*) FROM tabel WHERE ...;`,
  hints:[`SELECT COUNT(*) FROM laporan_polisi …`,`… WHERE kota = 'Kota Lembah';`],
  solution:`SELECT COUNT(*) FROM laporan_polisi WHERE kota='Kota Lembah';`,
  require:[/\bcount\s*\(/i], requireMsg:`Gunakan COUNT untuk menghitung.` },

{ ch:'ringkas', concept:'SUM, MIN, MAX, AVG', title:'Pasar kopi bulan ini',
  story:`Kopi curian pasti dijual. Tabel <code>penjualan_kopi</code> mencatat penjualan di pasar. Lihat gambaran besarnya dulu.`,
  task:`Dari penjualan_kopi, tampilkan dalam satu baris: total karung (SUM), harga_per_karung termurah (MIN), dan termahal (MAX), dengan urutan itu.`,
  explain:`SUM menjumlahkan, AVG merata-rata, MIN mencari nilai terkecil, MAX nilai terbesar. Beberapa agregat bisa ditulis sekaligus, dipisah koma.`,
  example:`SELECT SUM(a), AVG(a), MIN(b), MAX(b) FROM tabel;`,
  hints:[`SELECT SUM(karung), MIN(…), MAX(…) FROM penjualan_kopi;`,`MIN(harga_per_karung) dan MAX(harga_per_karung)`],
  solution:`SELECT SUM(karung), MIN(harga_per_karung), MAX(harga_per_karung) FROM penjualan_kopi;`,
  require:[/\bsum\s*\(/i,/\bmin\s*\(/i,/\bmax\s*\(/i], requireMsg:`Gunakan SUM, MIN, dan MAX.` },

{ ch:'ringkas', concept:'GROUP BY', title:'Siapa menjual berapa',
  story:`Harga termurah di pasar 900 ribu per karung, jauh di bawah harga wajar. Siapa yang menjual banyak dengan harga miring?`,
  task:`Dari penjualan_kopi, tampilkan warga_id dan total karung yang dijual setiap warga.`,
  explain:`GROUP BY mengelompokkan baris yang nilainya sama, lalu fungsi agregat dihitung per kelompok. Setiap kolom di SELECT yang bukan agregat harus ada di GROUP BY.`,
  example:`SELECT kolom, SUM(angka) AS total
FROM tabel
GROUP BY kolom;`,
  hints:[`SELECT warga_id, SUM(karung) …`,`Akhiri dengan GROUP BY warga_id`],
  solution:`SELECT warga_id, SUM(karung) AS total_karung FROM penjualan_kopi GROUP BY warga_id;`,
  require:[/\bgroup\s+by\b/i], requireMsg:`Gunakan GROUP BY.` },

{ ch:'ringkas', concept:'HAVING', title:'Penjual yang mencurigakan',
  story:`Yang hilang 40 karung. Saring kelompok penjual yang total jualannya mendekati angka itu.`,
  task:`Tampilkan warga_id dan total karung, hanya untuk warga yang total karungnya 30 atau lebih.`,
  explain:`WHERE menyaring baris sebelum dikelompokkan. HAVING menyaring kelompok setelah dihitung. Syarat yang memakai fungsi agregat harus ditulis di HAVING, bukan di WHERE.`,
  example:`SELECT kolom, SUM(x) AS total
FROM tabel
GROUP BY kolom
HAVING SUM(x) > 100;`,
  hints:[`Mulai dari query level sebelumnya.`,`Tambahkan HAVING SUM(karung) >= 30 setelah GROUP BY.`],
  solution:`SELECT warga_id, SUM(karung) AS total_karung FROM penjualan_kopi GROUP BY warga_id HAVING SUM(karung) >= 30;`,
  require:[/\bhaving\b/i], requireMsg:`Gunakan HAVING untuk menyaring hasil kelompok.`,
  win:`warga_id 4 menjual tepat 40 karung dengan harga di bawah pasar. Simpan petunjuk ini.` },

/* ---------- BAB 5: RELASI & JOIN ---------- */
{ ch:'join', concept:'INNER JOIN', title:'Pemilik pikap hijau', erd:true,
  story:`Dua pikap hijau berplat DB 8 cocok dengan keterangan saksi. Nama pemiliknya ada di tabel <code>warga</code>. Hubungkan lewat foreign key <code>kendaraan.warga_id</code>.`,
  task:`Tampilkan nama, no_plat, dan merek untuk kendaraan Hijau dengan plat diawali 'DB 8'.`,
  explain:`JOIN menggabungkan dua tabel. ON menyebut syarat penghubungnya, biasanya FK = PK. INNER JOIN (atau JOIN saja) hanya menampilkan baris yang punya pasangan di kedua tabel. Beri alias tabel (warga w) supaya query lebih pendek.`,
  example:`SELECT w.nama, k.merek
FROM kendaraan k
JOIN warga w ON k.warga_id = w.id
WHERE ...;`,
  hints:[`FROM kendaraan k JOIN warga w ON k.warga_id = w.id`,`WHERE k.warna = 'Hijau' AND k.no_plat LIKE 'DB 8%'`],
  solution:`SELECT w.nama, k.no_plat, k.merek FROM kendaraan k JOIN warga w ON k.warga_id = w.id WHERE k.warna='Hijau' AND k.no_plat LIKE 'DB 8%';`,
  require:[/\bjoin\b/i], requireMsg:`Gunakan JOIN untuk menggabungkan kendaraan dan warga.` },

{ ch:'join', concept:'JOIN tabel penghubung', title:'Siapa saja saksinya', erd:true,
  story:`Di Bab 3 kamu hanya melihat warga_id para saksi. Tampilkan nama mereka lewat tabel penghubung <code>saksi</code>.`,
  task:`Tampilkan nama saksi dan keterangannya untuk laporan_id 3.`,
  explain:`Tabel penghubung menyimpan pasangan FK. Untuk mendapatkan nama, gabungkan tabel penghubung dengan tabel yang ditunjuk FK-nya.`,
  example:`SELECT w.nama, s.keterangan
FROM saksi s
JOIN warga w ON s.warga_id = w.id
WHERE s.laporan_id = ...;`,
  hints:[`FROM saksi s JOIN warga w ON s.warga_id = w.id`,`WHERE s.laporan_id = 3`],
  solution:`SELECT w.nama, s.keterangan FROM saksi s JOIN warga w ON s.warga_id = w.id WHERE s.laporan_id = 3;`,
  require:[/\bjoin\b/i], requireMsg:`Gunakan JOIN antara saksi dan warga.` },

{ ch:'join', concept:'LEFT JOIN', title:'Yang tidak punya kendaraan', erd:true,
  story:`Saksi kedua, Fandi, bilang ia lewat sambil mengojek motor pinjaman. Siapa saja warga yang tidak punya kendaraan terdaftar sama sekali?`,
  task:`Tampilkan nama warga yang tidak punya satu pun kendaraan.`,
  explain:`LEFT JOIN menampilkan semua baris tabel kiri, walau tidak punya pasangan di tabel kanan. Kolom dari tabel kanan lalu berisi NULL. Saring dengan IS NULL untuk menemukan baris tanpa pasangan.`,
  example:`SELECT a.kolom
FROM tabelA a
LEFT JOIN tabelB b ON b.a_id = a.id
WHERE b.id IS NULL;`,
  hints:[`FROM warga w LEFT JOIN kendaraan k ON k.warga_id = w.id`,`WHERE k.no_plat IS NULL`],
  solution:`SELECT w.nama FROM warga w LEFT JOIN kendaraan k ON k.warga_id = w.id WHERE k.no_plat IS NULL;`,
  require:[/\bleft\s+(outer\s+)?join\b/i], requireMsg:`Level ini melatih LEFT JOIN.` },

{ ch:'join', concept:'JOIN + GROUP BY', title:'Pemilik lebih dari satu kendaraan', erd:true,
  story:`Relasi 1:N terlihat jelas ketika dihitung: ada warga yang punya lebih dari satu kendaraan.`,
  task:`Tampilkan nama dan jumlah kendaraan untuk warga yang punya lebih dari 1 kendaraan.`,
  explain:`JOIN, GROUP BY, dan HAVING bisa dipakai bersama. Kelompokkan per warga, hitung kendaraannya, lalu saring kelompok yang jumlahnya lebih dari 1.`,
  example:`SELECT w.nama, COUNT(*) AS jumlah
FROM warga w
JOIN kendaraan k ON k.warga_id = w.id
GROUP BY w.id, w.nama
HAVING COUNT(*) > 1;`,
  hints:[`JOIN warga dan kendaraan, lalu GROUP BY w.id, w.nama`,`HAVING COUNT(*) > 1`],
  solution:`SELECT w.nama, COUNT(*) AS jumlah_kendaraan FROM warga w JOIN kendaraan k ON k.warga_id = w.id GROUP BY w.id, w.nama HAVING COUNT(*) > 1;`,
  require:[/\bjoin\b/i,/\bgroup\s+by\b/i], requireMsg:`Gunakan JOIN dan GROUP BY.` },

{ ch:'join', concept:'JOIN 3 tabel', title:'Tunjuk pelakunya', erd:true,
  story:`Dua pemilik pikap hijau tersisa. Hanya satu yang tercatat masuk gudang pada malam pencurian.`,
  task:`Tampilkan hanya kolom nama dari pemilik pikap Hijau berplat 'DB 8%' yang tercatat di log_gudang pada 2026-10-12.`,
  explain:`JOIN bisa dirangkai. Hubungkan kendaraan ke warga, lalu warga ke log_gudang lewat log_gudang.warga_id = warga.id. Setelah itu saring di WHERE.`,
  example:`SELECT w.nama
FROM kendaraan k
JOIN warga w      ON k.warga_id = w.id
JOIN log_gudang l ON l.warga_id = w.id
WHERE ...;`,
  hints:[`Mulai dari query "Pemilik pikap hijau", lalu tambah JOIN log_gudang l ON l.warga_id = w.id`,`Tambah syarat AND l.tanggal = '2026-10-12', dan ubah SELECT menjadi w.nama saja.`],
  solution:`SELECT w.nama FROM kendaraan k JOIN warga w ON k.warga_id = w.id JOIN log_gudang l ON l.warga_id = w.id WHERE k.warna='Hijau' AND k.no_plat LIKE 'DB 8%' AND l.tanggal='2026-10-12';`,
  require:[/\bjoin\b|\bin\s*\(\s*select\b/i,/log_gudang/i], requireMsg:`Buktikan lewat data: gabungkan dengan log_gudang, jangan langsung menulis nama.`,
  win:`Stevi Rumengan: pemilik pikap hijau DB 8344 KC, masuk gudang pukul 21.40–23.55, lalu menjual 40 karung kopi di bawah harga pasar. Kasus terpecahkan.` },

/* ---------- BAB 6: SUBQUERY & CASE ---------- */

✓ saksi(laporan_id, warga_id)  -- satu baris per saksi`,
  q:`Mana yang melanggar 1NF?`,
  options:[[`Kolom saksi berisi "Rina, Fandi, Jefry"`,``],
           [`Kolom kerugian bernilai NULL`,`NULL boleh di 1NF. Itu tetap satu nilai, yaitu "tidak diketahui".`],
           [`Tabel punya primary key id`,`Justru primary key adalah salah satu syarat 1NF.`],
           [`Kolom tanggal bertipe TEXT`,`Tipe data tidak menentukan 1NF.`]], answer:0,
  why:`Daftar dipisah koma bukan nilai atomik. Kamu tidak bisa menghitung, mencari, atau menghubungkan saksi dengan rapi. Pecah menjadi tabel saksi dengan satu baris per saksi.` },
{ ch:'norm', type:'quiz', concept:'Functional dependency', title:'Siapa menentukan siapa',
  story:`Untuk menilai 2NF dan 3NF, kamu perlu satu alat: ketergantungan fungsional.`,
  explain:`Functional dependency A → B dibaca "A menentukan B": jika nilai A diketahui, nilai B pasti hanya satu. Contoh: nik → nama, karena satu NIK hanya milik satu orang. Sebaliknya nama → nik tidak berlaku, karena dua orang bisa bernama sama.`,
  example:`nik      → nama, alamat
no_plat  → merek, warna, nik
nama    ↛ nik   (nama bisa kembar)`,
  q:`Pernyataan no_plat → merek artinya…`,
  options:[[`Setiap merek hanya punya satu nomor plat`,`Arahnya terbalik. Satu merek bisa dipakai banyak kendaraan.`],
           [`Jika no_plat diketahui, mereknya pasti hanya satu`,``],
           [`no_plat dan merek selalu bernilai sama`,`Keduanya kolom berbeda dengan isi berbeda.`],
           [`merek adalah foreign key ke no_plat`,`Functional dependency bukan foreign key. Ia menggambarkan aturan di dalam data.`]], answer:1,
  why:`Kolom di sebelah kiri panah menentukan kolom di sebelah kanan. Primary key yang baik menentukan semua kolom lain di tabelnya.` },
{ ch:'norm', type:'quiz', concept:'2NF', title:'Tergantung sebagian kunci',
  story:`Arsip tilang lama memakai primary key gabungan (no_plat, kode_pasal).`,
  explain:`Bentuk normal kedua (2NF): sudah 1NF, dan setiap kolom bukan kunci bergantung pada SELURUH primary key, bukan hanya sebagian. Pelanggaran 2NF hanya mungkin terjadi pada tabel dengan primary key gabungan.`,
  example:`tilang(no_plat, kode_pasal, merek, denda)
PK = (no_plat, kode_pasal)
no_plat    → merek
kode_pasal → denda`,
  q:`Kenapa tabel tilang di atas belum memenuhi 2NF?`,
  options:[[`Karena primary key-nya terdiri dari dua kolom`,`Primary key gabungan itu sah. Masalahnya ada pada kolom yang bergantung pada sebagian kunci.`],
           [`Karena merek hanya bergantung pada no_plat dan denda hanya pada kode_pasal`,``],
           [`Karena ada kolom bertipe angka`,`Tipe data tidak ada hubungannya dengan 2NF.`],
           [`Karena tabelnya belum memenuhi 1NF`,`Setiap selnya sudah berisi satu nilai, jadi tabel ini sudah 1NF.`]], answer:1,
  why:`Pecah menjadi kendaraan(no_plat, merek), pasal(kode_pasal, denda), dan tilang(no_plat, kode_pasal). Setiap kolom kini bergantung pada seluruh kunci tabelnya.` },
{ ch:'norm', type:'quiz', concept:'3NF', title:'Tergantung lewat perantara',
  story:`Tabel warga di arsip lama menyimpan nama lurah di setiap baris warga.`,
  explain:`Bentuk normal ketiga (3NF): sudah 2NF, dan tidak ada ketergantungan transitif, yaitu kolom bukan kunci yang bergantung pada kolom bukan kunci lain. Ringkasnya: setiap kolom bergantung pada kunci, seluruh kunci, dan hanya kunci.`,
  example:`warga_lama(id, nama, kelurahan, lurah)
id        → kelurahan
kelurahan → lurah     ← lewat perantara
Perbaikan: kelurahan(nama, lurah)
           warga(id, nama, kelurahan)`,
  q:`Kenapa warga_lama belum memenuhi 3NF?`,
  options:[[`Karena lurah bergantung pada kelurahan, yang bukan kunci`,``],
           [`Karena nama warga bisa kembar`,`Nama boleh kembar. Primary key-nya id.`],
           [`Karena tabelnya tidak punya foreign key`,`Foreign key bukan syarat 3NF.`],
           [`Karena kolom lurah bisa NULL`,`NULL tidak menentukan bentuk normal.`]], answer:0,
  why:`id → kelurahan → lurah adalah ketergantungan transitif. Jika lurah berganti, kamu harus mengubah banyak baris (anomali update lagi). Pindahkan lurah ke tabel kelurahan.` },
{ ch:'norm', concept:'Mendeteksi data ganda', title:'Seberapa parah arsipnya',
  setup:ARSIP, extraTables:[T_ARSIP],
  story:`Arsip pendaftaran kendaraan lama tersimpan di tabel <code>arsip_kendaraan</code>. Data pemiliknya ikut disalin di setiap kendaraan.`,
  task:`Tampilkan nik, nama_pemilik, dan jumlah kendaraannya, hanya untuk pemilik yang datanya muncul di lebih dari satu baris.`,
  explain:`Data ganda bisa dideteksi dengan GROUP BY pada kolom yang seharusnya unik, lalu HAVING COUNT(*) > 1. Setiap baris tambahan adalah salinan yang berpotensi menimbulkan anomali.`,
  example:`SELECT kolom, COUNT(*)
FROM tabel
GROUP BY kolom
HAVING COUNT(*) > 1;`,
  hints:[`GROUP BY nik, nama_pemilik`,`HAVING COUNT(*) > 1`],
  solution:`SELECT nik, nama_pemilik, COUNT(*) AS jumlah FROM arsip_kendaraan GROUP BY nik, nama_pemilik HAVING COUNT(*) > 1;`,
  require:[/\bgroup\s+by\b/i,/\bhaving\b/i], requireMsg:`Gunakan GROUP BY dan HAVING.` },
{ ch:'norm', type:'dml', concept:'Memecah tabel (1)', title:'Tabel pemilik',
  setup:ARSIP, extraTables:[T_ARSIP],
  story:`Langkah pertama normalisasi: pindahkan data pemilik ke tabelnya sendiri, satu baris per orang.`,
  task:`Buat tabel pemilik (nik TEXT PRIMARY KEY, nama TEXT NOT NULL, alamat TEXT), lalu isi dari arsip_kendaraan tanpa duplikat.`,
  explain:`INSERT INTO … SELECT memasukkan hasil query ke tabel lain. Dengan SELECT DISTINCT, setiap pemilik hanya masuk sekali. Kamu bisa menulis beberapa perintah sekaligus, dipisah titik koma.`,
  example:`CREATE TABLE baru (...);
INSERT INTO baru (a, b)
SELECT DISTINCT x, y FROM lama;`,
  hints:[`Tulis CREATE TABLE pemilik (…); lalu INSERT INTO pemilik (nik, nama, alamat) SELECT …`,`SELECT DISTINCT nik, nama_pemilik, alamat_pemilik FROM arsip_kendaraan`],
  solution:`CREATE TABLE pemilik (nik TEXT PRIMARY KEY, nama TEXT NOT NULL, alamat TEXT);
INSERT INTO pemilik (nik, nama, alamat) SELECT DISTINCT nik, nama_pemilik, alamat_pemilik FROM arsip_kendaraan;`,
  verify:[V_STRUKTUR('pemilik'), `SELECT * FROM pemilik ORDER BY nik`],
  vlabels:[`Struktur tabel pemilik`,`Isi tabel pemilik`],
  require:[/\bcreate\s+table\b/i,/\binsert\s+into\b[\s\S]*\bselect\b/i], requireMsg:`Gunakan CREATE TABLE lalu INSERT INTO … SELECT.` },
{ ch:'norm', type:'dml', concept:'Memecah tabel (2)', title:'Kendaraan yang merujuk pemilik',
  setup:ARSIP+PEMILIK, extraTables:[T_ARSIP,T_PEMILIK],
  story:`Tabel pemilik sudah jadi. Sekarang kendaraan cukup menyimpan nik sebagai foreign key, tanpa nama dan alamat.`,
  task:`Buat tabel kendaraan_baru (no_plat TEXT PRIMARY KEY, merek TEXT, warna TEXT, nik TEXT yang merujuk pemilik(nik)), lalu isi dari arsip_kendaraan.`,
  explain:`Setelah dipecah, setiap fakta tersimpan sekali: data orang di pemilik, data kendaraan di kendaraan_baru. Kolom nik menjadi foreign key yang menghubungkan keduanya.`,
  example:`CREATE TABLE anak (
  kode TEXT PRIMARY KEY,
  induk_kode TEXT REFERENCES induk(kode)
);
INSERT INTO anak SELECT … FROM lama;`,
  hints:[`nik TEXT REFERENCES pemilik(nik)`,`INSERT INTO kendaraan_baru (no_plat, merek, warna, nik) SELECT no_plat, merek, warna, nik FROM arsip_kendaraan;`],
  solution:`CREATE TABLE kendaraan_baru (no_plat TEXT PRIMARY KEY, merek TEXT, warna TEXT, nik TEXT REFERENCES pemilik(nik));
INSERT INTO kendaraan_baru (no_plat, merek, warna, nik) SELECT no_plat, merek, warna, nik FROM arsip_kendaraan;`,
  verify:[V_FK('kendaraan_baru'), `SELECT * FROM kendaraan_baru ORDER BY no_plat`],
  vlabels:[`Foreign key kendaraan_baru`,`Isi kendaraan_baru`],
  require:[/\bcreate\s+table\b/i,/\breferences\b/i], requireMsg:`Gunakan CREATE TABLE dengan REFERENCES.` },
{ ch:'norm', concept:'Dekomposisi tanpa kehilangan', title:'Buktikan tidak ada yang hilang',
  setup:ARSIP+PEMILIK+KBARU, extraTables:[T_ARSIP,T_PEMILIK,T_KBARU],
  story:`Normalisasi yang benar bersifat lossless: tabel asli bisa disusun ulang persis dari tabel-tabel hasil pecahan.`,
  task:`Gabungkan kendaraan_baru dan pemilik untuk menampilkan no_plat, merek, warna, nik, nama, dan alamat (7 baris, sama dengan arsip).`,
  explain:`Dekomposisi lossless berarti JOIN tabel-tabel hasil pecahan menghasilkan data yang sama dengan tabel asli, tanpa baris hilang atau baris palsu. Ini cara membuktikan normalisasimu benar.`,
  example:`SELECT ...
FROM anak a
JOIN induk i ON a.induk_kode = i.kode;`,
  hints:[`FROM kendaraan_baru k JOIN pemilik p ON k.nik = p.nik`,`SELECT k.no_plat, k.merek, k.warna, p.nik, p.nama, p.alamat …`],
  solution:`SELECT k.no_plat, k.merek, k.warna, p.nik, p.nama, p.alamat FROM kendaraan_baru k JOIN pemilik p ON k.nik = p.nik;`,
  require:[/\bjoin\b/i], requireMsg:`Gunakan JOIN antara kendaraan_baru dan pemilik.`,
  win:`7 baris kembali utuh. Data pemilik kini tersimpan sekali saja, jadi tidak ada lagi anomali update, insert, maupun delete.` },

/* ---- saring ---- */
{ ch:'saring', after:'OR & IN', concept:'NOT', title:'Selain kopi',
  story:`Untuk menyingkirkan orang yang tidak relevan, kamu juga perlu tahu warga yang <em>bukan</em> petani kopi dan bukan pedagang.`,
  task:`Tampilkan nama dan pekerjaan warga yang pekerjaannya bukan Petani kopi dan bukan Pedagang.`,
  explain:`NOT membalik syarat: NOT IN, NOT LIKE, NOT BETWEEN, IS NOT NULL. Operator <> atau != berarti "tidak sama dengan". Ingat: NOT IN tidak akan cocok dengan baris yang nilainya NULL.`,
  example:`WHERE kota NOT IN ('A', 'B')
WHERE nama NOT LIKE 'R%'
WHERE kerugian IS NOT NULL`,
  hints:[`WHERE pekerjaan NOT IN (…)`,`WHERE pekerjaan NOT IN ('Petani kopi', 'Pedagang')`],
  solution:`SELECT nama, pekerjaan FROM warga WHERE pekerjaan NOT IN ('Petani kopi','Pedagang');`,
  require:[/\bnot\b|<>|!=/i], requireMsg:`Gunakan NOT atau <>.`,
  alt:[`SELECT nama, pekerjaan FROM warga WHERE pekerjaan <> 'Petani kopi' AND pekerjaan <> 'Pedagang';`] },

/* ---- ringkas ---- */
{ ch:'ringkas', after:'ORDER BY', concept:'ORDER BY banyak kolom', title:'Urut per profesi',
  story:`Daftar warga untuk rapat harus dikelompokkan per pekerjaan, dan di dalam tiap pekerjaan yang termuda di atas.`,
  task:`Tampilkan nama, pekerjaan, dan tahun_lahir warga, urut menurut pekerjaan (A–Z), lalu tahun_lahir dari yang terbesar.`,
  explain:`ORDER BY bisa memakai beberapa kolom. Kolom kedua hanya dipakai untuk memecah urutan baris yang nilai kolom pertamanya sama. Setiap kolom punya ASC/DESC sendiri.`,
  example:`ORDER BY kota ASC, tanggal DESC`,
  hints:[`ORDER BY pekerjaan, tahun_lahir …`,`ORDER BY pekerjaan ASC, tahun_lahir DESC`],
  solution:`SELECT nama, pekerjaan, tahun_lahir FROM warga ORDER BY pekerjaan ASC, tahun_lahir DESC;`,
  orderMatters:true, require:[/\border\s+by\b[^;]*,/i], requireMsg:`Urutkan dengan dua kolom di ORDER BY.` },
{ ch:'ringkas', after:'DESC + LIMIT', concept:'LIMIT + OFFSET', title:'Halaman kedua',
  story:`Aplikasi kepolisian menampilkan laporan 5 per halaman. Petugas membuka halaman 2.`,
  task:`Tampilkan semua kolom laporan_polisi untuk halaman 2, jika setiap halaman berisi 5 laporan yang diurutkan menurut id.`,
  explain:`OFFSET melewati sejumlah baris sebelum mulai mengambil. Halaman ke-n dengan ukuran k memakai LIMIT k OFFSET (n−1)×k. Selalu sertakan ORDER BY agar halamannya konsisten.`,
  example:`SELECT * FROM tabel
ORDER BY id
LIMIT 10 OFFSET 20;  -- halaman 3`,
  hints:[`Halaman 2 melewati 5 baris pertama.`,`ORDER BY id LIMIT 5 OFFSET 5`],
  solution:`SELECT * FROM laporan_polisi ORDER BY id LIMIT 5 OFFSET 5;`,
  orderMatters:true, require:[/\boffset\b|\blimit\s+\d+\s*,/i], requireMsg:`Gunakan OFFSET.` },
{ ch:'ringkas', after:'LIMIT + OFFSET', type:'quiz', concept:'Urutan eksekusi', title:'Kenapa alias tidak dikenal',
  story:`Seorang rekan menulis query berikut dan bingung kenapa muncul error "no such column: rugi".`,
  explain:`SQL ditulis dengan urutan SELECT → FROM → WHERE → …, tapi dijalankan dengan urutan berbeda: FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT. Alias dibuat di tahap SELECT, sehingga belum dikenal di WHERE, GROUP BY standar, dan HAVING standar, tapi sudah bisa dipakai di ORDER BY.`,
  example:`SELECT jenis, kerugian AS rugi
FROM laporan_polisi
WHERE rugi > 1000000;   -- error

urutan jalan: FROM → WHERE → GROUP BY
→ HAVING → SELECT → ORDER BY → LIMIT`,
  q:`Kenapa query di atas error?`,
  options:[[`WHERE dijalankan sebelum SELECT, jadi alias rugi belum ada`,``],
           [`Alias tidak boleh memakai huruf kecil`,`Huruf kecil boleh. Masalahnya ada pada urutan eksekusi.`],
           [`Kolom kerugian tidak ada`,`Kolom kerugian ada. Yang tidak dikenal adalah alias rugi.`],
           [`AS hanya boleh dipakai pada fungsi agregat`,`AS boleh dipakai pada kolom apa saja.`]], answer:0,
  why:`Tulis kolom aslinya di WHERE: WHERE kerugian > 1000000. Alias boleh dipakai di ORDER BY karena ORDER BY dijalankan setelah SELECT. (SQLite sebenarnya cukup longgar, tapi database lain akan menolak.)` },
{ ch:'ringkas', after:'COUNT', concept:'COUNT DISTINCT', title:'Berapa orang berbeda',
  story:`Buku tamu gudang punya 13 baris, tapi banyak yang orangnya sama.`,
  task:`Hitung berapa warga berbeda yang pernah tercatat di log_gudang. Hasilnya satu angka.`,
  explain:`COUNT(DISTINCT kolom) menghitung nilai unik saja. COUNT(*) menghitung semua baris, termasuk yang orangnya sama.`,
  example:`SELECT COUNT(DISTINCT kolom) FROM tabel;`,
  hints:[`COUNT(DISTINCT …)`,`SELECT COUNT(DISTINCT warga_id) FROM log_gudang;`],
  solution:`SELECT COUNT(DISTINCT warga_id) FROM log_gudang;`,
  require:[/count\s*\(\s*distinct/i], requireMsg:`Gunakan COUNT(DISTINCT …).` },

/* ---- fungsi ---- */
{ ch:'fungsi', concept:'Kolom hitungan', title:'Nilai setiap penjualan',
  story:`Untuk menaksir keuntungan pelaku, hitung nilai uang dari setiap penjualan kopi.`,
  task:`Dari penjualan_kopi, tampilkan id, karung, harga_per_karung, dan kolom omzet berisi karung × harga_per_karung.`,
  explain:`SELECT bisa menghitung ekspresi dari kolom lain: + − * / dan %. Hasilnya kolom baru di hasil query, bukan kolom yang tersimpan di tabel. Beri nama dengan AS. Hati-hati: pembagian dua bilangan bulat menghasilkan bilangan bulat (7/2 = 3), jadi gunakan 7.0/2 untuk hasil desimal.`,
  example:`SELECT harga, jumlah, harga * jumlah AS total
FROM tabel;`,
  hints:[`karung * harga_per_karung AS omzet`,`SELECT id, karung, harga_per_karung, karung * harga_per_karung AS omzet FROM penjualan_kopi;`],
  solution:`SELECT id, karung, harga_per_karung, karung * harga_per_karung AS omzet FROM penjualan_kopi;`,
  require:[/\*/], requireMsg:`Hitung omzet dengan operator *.` },
{ ch:'fungsi', concept:'ROUND + AVG', title:'Rata-rata harga per penjual',
  story:`Bandingkan harga jual rata-rata setiap penjual. Angka desimal yang panjang menyulitkan pembaca.`,
  task:`Tampilkan warga_id dan rata-rata harga_per_karung setiap penjual, dibulatkan tanpa desimal dengan ROUND.`,
  explain:`ROUND(nilai) membulatkan ke bilangan bulat terdekat, dan ROUND(nilai, 2) menyisakan 2 desimal. Fungsi bisa dibungkus fungsi lain: ROUND(AVG(...)).`,
  example:`SELECT kelompok, ROUND(AVG(nilai)) AS rata2
FROM tabel
GROUP BY kelompok;`,
  hints:[`ROUND(AVG(harga_per_karung))`,`… FROM penjualan_kopi GROUP BY warga_id;`],
  solution:`SELECT warga_id, ROUND(AVG(harga_per_karung)) AS rata_harga FROM penjualan_kopi GROUP BY warga_id;`,
  require:[/\bround\s*\(/i,/\bavg\s*\(/i], requireMsg:`Gunakan ROUND dan AVG.`,
  win:`warga_id 4 menjual rata-rata Rp916.667 per karung, jauh di bawah penjual lain.` },
{ ch:'fungsi', concept:'Fungsi teks', title:'Kode singkat warga',
  story:`Sistem lama butuh kode singkat 3 huruf kapital untuk setiap warga.`,
  task:`Tampilkan nama dan 3 huruf pertama nama dalam huruf kapital.`,
  explain:`Fungsi teks yang umum: UPPER (huruf kapital), LOWER (huruf kecil), LENGTH (panjang), SUBSTR(teks, mulai, panjang) mengambil potongan (mulai dari posisi 1), TRIM membuang spasi di tepi, REPLACE mengganti teks.`,
  example:`SELECT UPPER('kopi');           -- KOPI
SELECT SUBSTR('Robusta', 1, 3); -- Rob
SELECT LENGTH('Lembah');        -- 6`,
  hints:[`SUBSTR(nama, 1, 3)`,`UPPER(SUBSTR(nama, 1, 3))`],
  solution:`SELECT nama, UPPER(SUBSTR(nama, 1, 3)) AS kode FROM warga;`,
  require:[/\bupper\s*\(/i,/\bsubstr(ing)?\s*\(/i], requireMsg:`Gunakan UPPER dan SUBSTR.` },
{ ch:'fungsi', concept:'Gabung teks ||', title:'Label kendaraan',
  story:`Petugas lapangan minta label singkat untuk setiap pikap, misalnya "Toyota Hilux - Hijau".`,
  task:`Untuk kendaraan berjenis Pikap, tampilkan no_plat dan label berisi merek, spasi-strip-spasi, lalu warna.`,
  explain:`Operator || menyambung teks di SQLite dan PostgreSQL. MySQL memakai fungsi CONCAT(a, b). Teks tambahan ditulis dalam kutip tunggal.`,
  example:`SELECT nama || ' (' || kota || ')' AS label FROM tabel;`,
  hints:[`merek || ' - ' || warna`,`… FROM kendaraan WHERE jenis = 'Pikap';`],
  solution:`SELECT no_plat, merek || ' - ' || warna AS label FROM kendaraan WHERE jenis = 'Pikap';`,
  require:[/\|\||concat\s*\(/i], requireMsg:`Gabungkan teks dengan ||.` },
{ ch:'fungsi', concept:'Fungsi tanggal', title:'Batas waktu penyelidikan',
  story:`Setiap kasus pencurian harus selesai diselidiki dalam 30 hari sejak tanggal laporan.`,
  task:`Untuk laporan berjenis Pencurian, tampilkan id, tanggal, dan tanggal 30 hari kemudian.`,
  explain:`SQLite menyimpan tanggal sebagai teks 'YYYY-MM-DD' dan punya fungsi tanggal: date(tgl, '+30 days') menambah hari, strftime('%m', tgl) mengambil bulan, julianday(tgl) mengubah tanggal menjadi angka hari sehingga dua tanggal bisa dikurangkan. Database lain memakai nama fungsi berbeda (DATE_ADD, EXTRACT).`,
  example:`SELECT date('2026-10-12', '+7 days');   -- 2026-10-19
SELECT strftime('%Y-%m', '2026-10-12'); -- 2026-10
SELECT julianday('2026-10-31') - julianday('2026-10-12'); -- 19.0`,
  hints:[`date(tanggal, '+30 days')`,`SELECT id, tanggal, date(tanggal, '+30 days') AS batas FROM laporan_polisi WHERE jenis = 'Pencurian';`],
  solution:`SELECT id, tanggal, date(tanggal, '+30 days') AS batas FROM laporan_polisi WHERE jenis = 'Pencurian';`,
  require:[/\bdate\s*\(|\bstrftime\s*\(|\bjulianday\s*\(/i], requireMsg:`Gunakan fungsi tanggal date().` },
{ ch:'fungsi', concept:'Selisih tanggal', title:'Rentang laporan bulan ini',
  story:`Atasan bertanya: berapa hari jarak antara laporan pertama dan laporan terakhir bulan Oktober?`,
  task:`Hitung selisih hari antara tanggal laporan paling akhir dan paling awal di laporan_polisi. Hasilnya satu angka.`,
  explain:`julianday() mengubah tanggal menjadi angka. Selisih dua julianday adalah jumlah hari di antaranya. Fungsi ini bisa digabung dengan MIN dan MAX.`,
  example:`SELECT julianday(MAX(tgl)) - julianday(MIN(tgl)) FROM tabel;`,
  hints:[`julianday(MAX(tanggal))`,`SELECT julianday(MAX(tanggal)) - julianday(MIN(tanggal)) FROM laporan_polisi;`],
  solution:`SELECT julianday(MAX(tanggal)) - julianday(MIN(tanggal)) AS selisih_hari FROM laporan_polisi;`,
  require:[/\bjulianday\s*\(/i], requireMsg:`Gunakan julianday().` },
{ ch:'fungsi', concept:'COALESCE', title:'Ganti yang kosong',
  story:`Laporan keuangan tidak boleh menampilkan sel kosong. Kerugian yang belum dihitung ditulis 0.`,
  task:`Tampilkan id, jenis, dan kerugian dari semua laporan, dengan kerugian NULL diganti 0.`,
  explain:`COALESCE(a, b, …) mengembalikan nilai pertama yang tidak NULL. Fungsi ini berguna untuk memberi nilai pengganti. IFNULL(a, b) di SQLite/MySQL bekerja sama untuk dua argumen.`,
  example:`SELECT COALESCE(telepon, '-') FROM tabel;`,
  hints:[`COALESCE(kerugian, 0)`,`SELECT id, jenis, COALESCE(kerugian, 0) AS kerugian FROM laporan_polisi;`],
  solution:`SELECT id, jenis, COALESCE(kerugian, 0) AS kerugian FROM laporan_polisi;`,
  require:[/\bcoalesce\s*\(|\bifnull\s*\(/i], requireMsg:`Gunakan COALESCE atau IFNULL.` },

/* ---- join ---- */
{ ch:'join', after:'JOIN 3 tabel', type:'quiz', concept:'RIGHT & FULL JOIN', title:'Kiri, kanan, atau semua',
  story:`Kamu sudah memakai INNER JOIN dan LEFT JOIN. Masih ada dua jenis lagi.`,
  explain:`INNER JOIN: hanya baris yang punya pasangan. LEFT JOIN: semua baris kiri, pasangan kanan jika ada. RIGHT JOIN: kebalikannya, semua baris kanan. FULL OUTER JOIN: semua baris dari kedua sisi; yang tidak punya pasangan diisi NULL. SQLite mendukung RIGHT dan FULL sejak versi 3.39.`,
  example:`A LEFT JOIN B   → semua A
A RIGHT JOIN B  → semua B
A FULL JOIN B   → semua A dan semua B
A INNER JOIN B  → hanya yang cocok`,
  q:`warga RIGHT JOIN kendaraan ON kendaraan.warga_id = warga.id menghasilkan hal yang sama dengan…`,
  options:[[`warga LEFT JOIN kendaraan`,`Itu mempertahankan semua warga, termasuk yang tidak punya kendaraan.`],
           [`kendaraan LEFT JOIN warga`,``],
           [`warga FULL JOIN kendaraan`,`FULL mempertahankan semua baris dari kedua tabel.`],
           [`warga CROSS JOIN kendaraan`,`CROSS JOIN tidak memakai syarat ON sama sekali.`]], answer:1,
  why:`A RIGHT JOIN B sama dengan B LEFT JOIN A (urutan kolomnya saja yang berbeda). Karena itu banyak orang hanya memakai LEFT JOIN dan menukar urutan tabel.` },
{ ch:'join', after:'RIGHT & FULL JOIN', type:'quiz', concept:'CROSS JOIN', title:'Semua pasangan',
  story:`Seorang rekan lupa menulis ON dan hasil query-nya tiba-tiba sangat besar.`,
  explain:`CROSS JOIN memasangkan setiap baris tabel A dengan setiap baris tabel B, disebut juga hasil kali kartesius. Jumlah barisnya = baris A × baris B. Kadang berguna (misalnya membuat semua kombinasi jadwal), tapi sering terjadi tanpa sengaja karena lupa menulis syarat JOIN.`,
  example:`SELECT * FROM a CROSS JOIN b;
-- sama dengan
SELECT * FROM a, b;   -- tanpa WHERE penghubung`,
  q:`Tabel warga punya 12 baris dan kendaraan 12 baris. Berapa baris hasil warga CROSS JOIN kendaraan?`,
  options:[[`12`,`12 adalah jumlah pasangan yang benar-benar cocok lewat warga_id, bukan hasil CROSS JOIN.`],[`24`,`Itu penjumlahan. CROSS JOIN mengalikan jumlah baris.`],[`144`,``],[`0`,`CROSS JOIN tidak menyaring apa pun.`]], answer:2,
  why:`12 × 12 = 144. Jika hasil JOIN-mu tiba-tiba membengkak, periksa apakah syarat ON-nya terlewat.` },
{ ch:'join', after:'CROSS JOIN', concept:'SELF JOIN', title:'Kendaraan kembar merek',
  story:`Pelaku kadang memakai kendaraan bermerek sama untuk mengecoh saksi. Cari pasangan kendaraan dengan merek yang sama.`,
  task:`Tampilkan merek dan pasangan no_plat (dua kolom no_plat) untuk kendaraan yang mereknya sama. Setiap pasangan cukup muncul sekali.`,
  explain:`SELF JOIN adalah tabel yang di-JOIN dengan dirinya sendiri, memakai dua alias berbeda. Syarat a.no_plat < b.no_plat mencegah sebuah kendaraan dipasangkan dengan dirinya sendiri dan mencegah pasangan muncul dua kali (A-B dan B-A).`,
  example:`SELECT a.x, b.x
FROM tabel a
JOIN tabel b ON a.kolom = b.kolom
           AND a.id < b.id;`,
  hints:[`FROM kendaraan a JOIN kendaraan b ON a.merek = b.merek`,`Tambahkan AND a.no_plat < b.no_plat. SELECT a.merek, a.no_plat, b.no_plat`],
  solution:`SELECT a.merek, a.no_plat, b.no_plat FROM kendaraan a JOIN kendaraan b ON a.merek = b.merek AND a.no_plat < b.no_plat;`,
  require:[/\bjoin\b/i], requireMsg:`Gunakan JOIN tabel kendaraan dengan dirinya sendiri.` },
{ ch:'join', after:'SELF JOIN', concept:'UNION', title:'Semua yang terlibat',
  story:`Buat daftar semua warga_id yang terlibat malam itu: para saksi laporan 3 dan semua yang masuk gudang tanggal 2026-10-12.`,
  task:`Gabungkan warga_id dari saksi (laporan_id 3) dan warga_id dari log_gudang (tanggal 2026-10-12), tanpa duplikat.`,
  explain:`UNION menumpuk hasil dua query menjadi satu dan membuang baris kembar. UNION ALL menumpuk tanpa membuang duplikat (lebih cepat). Kedua query harus punya jumlah kolom yang sama dengan tipe yang sejalan.`,
  example:`SELECT kolom FROM tabel_a WHERE ...
UNION
SELECT kolom FROM tabel_b WHERE ...;`,
  hints:[`SELECT warga_id FROM saksi WHERE laporan_id = 3`,`… UNION SELECT warga_id FROM log_gudang WHERE tanggal = '2026-10-12';`],
  solution:`SELECT warga_id FROM saksi WHERE laporan_id = 3 UNION SELECT warga_id FROM log_gudang WHERE tanggal = '2026-10-12';`,
  require:[/\bunion\b/i], requireMsg:`Gunakan UNION.` },
{ ch:'join', after:'UNION', concept:'INTERSECT', title:'Ke gudang dan ke pasar',
  story:`Siapa yang pernah masuk gudang <em>dan</em> juga pernah menjual kopi di pasar?`,
  task:`Tampilkan warga_id yang muncul di log_gudang dan juga di penjualan_kopi.`,
  explain:`INTERSECT mengambil baris yang ada di kedua hasil query. EXCEPT mengambil baris di query pertama yang tidak ada di query kedua (di Oracle namanya MINUS).`,
  example:`SELECT x FROM a
INTERSECT
SELECT x FROM b;`,
  hints:[`SELECT warga_id FROM log_gudang INTERSECT SELECT …`,`… INTERSECT SELECT warga_id FROM penjualan_kopi;`],
  solution:`SELECT warga_id FROM log_gudang INTERSECT SELECT warga_id FROM penjualan_kopi;`,
  require:[/\bintersect\b/i], requireMsg:`Gunakan INTERSECT.` },
{ ch:'join', after:'INTERSECT', concept:'EXCEPT', title:'Ke pasar tanpa ke gudang',
  story:`Ada penjual kopi yang tidak pernah masuk gudang. Mereka mungkin memang petani sungguhan.`,
  task:`Tampilkan warga_id yang ada di penjualan_kopi tetapi tidak pernah tercatat di log_gudang.`,
  explain:`EXCEPT mengambil hasil query pertama, lalu membuang baris yang juga muncul di query kedua. Urutan query penting: A EXCEPT B tidak sama dengan B EXCEPT A.`,
  example:`SELECT x FROM a
EXCEPT
SELECT x FROM b;`,
  hints:[`Mulai dari penjualan_kopi.`,`SELECT warga_id FROM penjualan_kopi EXCEPT SELECT warga_id FROM log_gudang;`],
  solution:`SELECT warga_id FROM penjualan_kopi EXCEPT SELECT warga_id FROM log_gudang;`,
  require:[/\bexcept\b/i], requireMsg:`Gunakan EXCEPT.` },

/* ---- sub ---- */
{ ch:'sub', after:'IN (subquery)', concept:'EXISTS', title:'Pemilik sepeda motor',
  story:`Saksi Novi melihat orang membawa tabung gas naik motor. Siapa saja warga yang punya motor?`,
  task:`Tampilkan nama warga yang punya setidaknya satu kendaraan berjenis Motor, memakai EXISTS.`,
  explain:`EXISTS (subquery) bernilai benar jika subquery menghasilkan minimal satu baris. Subquery-nya biasanya berkorelasi: ia merujuk kolom dari query luar (k.warga_id = w.id), sehingga dijalankan untuk setiap baris warga.`,
  example:`SELECT a.nama FROM a
WHERE EXISTS (
  SELECT 1 FROM b
  WHERE b.a_id = a.id AND ...
);`,
  hints:[`WHERE EXISTS (SELECT 1 FROM kendaraan k WHERE k.warga_id = w.id …)`,`… AND k.jenis = 'Motor')`],
  solution:`SELECT w.nama FROM warga w WHERE EXISTS (SELECT 1 FROM kendaraan k WHERE k.warga_id = w.id AND k.jenis = 'Motor');`,
  require:[/\bexists\b/i], requireMsg:`Gunakan EXISTS.` },
{ ch:'sub', after:'EXISTS', concept:'NOT EXISTS', title:'Yang belum pernah bersaksi',
  story:`Untuk sidang, jaksa butuh saksi baru yang belum pernah memberi keterangan di laporan mana pun.`,
  task:`Tampilkan nama warga yang tidak pernah tercatat di tabel saksi, memakai NOT EXISTS.`,
  explain:`NOT EXISTS benar jika subquery tidak menghasilkan baris sama sekali. Ini cara aman mencari data "yang tidak punya pasangan". Berbeda dengan NOT IN, NOT EXISTS tidak terganggu nilai NULL.`,
  example:`SELECT a.nama FROM a
WHERE NOT EXISTS (
  SELECT 1 FROM b WHERE b.a_id = a.id
);`,
  hints:[`WHERE NOT EXISTS (SELECT 1 FROM saksi s WHERE …)`,`… WHERE s.warga_id = w.id)`],
  solution:`SELECT w.nama FROM warga w WHERE NOT EXISTS (SELECT 1 FROM saksi s WHERE s.warga_id = w.id);`,
  require:[/\bnot\s+exists\b/i], requireMsg:`Gunakan NOT EXISTS.`,
  alt:[`SELECT w.nama FROM warga w LEFT JOIN saksi s ON s.warga_id = w.id WHERE s.id IS NULL;`] },
{ ch:'sub', after:'NOT EXISTS', concept:'Subquery di FROM', title:'Rata-rata dari total',
  story:`Berapa rata-rata total karung yang dijual setiap penjual? Ini butuh dua tingkat hitungan: total per orang, lalu rata-ratanya.`,
  task:`Hitung rata-rata dari total karung per warga_id di penjualan_kopi. Hasilnya satu angka.`,
  explain:`Subquery di FROM (disebut derived table) diperlakukan seperti tabel sementara. Ia wajib diberi alias di banyak database. Fungsi agregat tidak bisa ditumpuk langsung (AVG(SUM(x)) error), jadi pakai subquery.`,
  example:`SELECT AVG(total) FROM (
  SELECT kelompok, SUM(x) AS total
  FROM tabel GROUP BY kelompok
) AS t;`,
  hints:[`Subquery-nya: SELECT warga_id, SUM(karung) AS total FROM penjualan_kopi GROUP BY warga_id`,`SELECT AVG(total) FROM ( … ) AS t;`],
  solution:`SELECT AVG(total) FROM (SELECT warga_id, SUM(karung) AS total FROM penjualan_kopi GROUP BY warga_id) AS t;`,
  require:[/\bfrom\s*\(\s*select\b/i], requireMsg:`Letakkan subquery di dalam FROM.` },

/* ---- ubah ---- */
{ ch:'ubah', after:'Constraint NOT NULL', type:'error', concept:'Constraint UNIQUE', title:'Uji KTP ganda',
  story:`Relasi 1:1 antara warga dan KTP dijaga oleh UNIQUE pada ktp.warga_id. Uji penjaganya.`,
  task:`Coba masukkan KTP baru dengan nik '7171999999990099' untuk warga_id 4 (Stevi sudah punya KTP). Level selesai jika database menolaknya.`,
  explain:`UNIQUE menolak nilai kembar di kolom yang bukan primary key. Ini yang menjaga relasi 1:1: satu warga tidak bisa punya dua KTP.`,
  example:`INSERT INTO ktp (nik, warga_id)
VALUES ('123', 1);
-- Error: UNIQUE constraint failed: ktp.warga_id`,
  hints:[`INSERT INTO ktp (nik, warga_id, tempat_lahir) VALUES (…);`,`VALUES ('7171999999990099', 4, 'Manado')`],
  solution:`INSERT INTO ktp (nik, warga_id, tempat_lahir) VALUES ('7171999999990099', 4, 'Manado');`,
  expectErr:/unique constraint failed: ktp\.warga_id/i, require:[/\binsert\b/i], requireMsg:`Gunakan INSERT.`,
  win:`UNIQUE pada foreign key mengubah relasi 1:N menjadi 1:1.` },
{ ch:'ubah', after:'Constraint UNIQUE', type:'quiz', concept:'Transaksi & ACID', title:'Semua atau tidak sama sekali',
  story:`Petugas memindahkan 40 karung dari catatan "barang hilang" ke catatan "barang bukti". Di tengah proses, listrik padam.`,
  explain:`Transaksi mengelompokkan beberapa perintah menjadi satu kesatuan. BEGIN memulai, COMMIT menyimpan permanen, ROLLBACK membatalkan semua perubahan sejak BEGIN. Transaksi menjamin ACID: Atomicity (semua atau tidak sama sekali), Consistency (aturan data tetap terjaga), Isolation (transaksi tidak saling mengganggu), Durability (yang sudah di-COMMIT tidak hilang).`,
  example:`BEGIN;
UPDATE stok SET jumlah = jumlah - 40 WHERE id = 1;
UPDATE stok SET jumlah = jumlah + 40 WHERE id = 2;
COMMIT;`,
  q:`Kedua UPDATE ada dalam satu transaksi, dan listrik padam sebelum COMMIT. Setelah listrik menyala, isi database…`,
  options:[[`Hanya UPDATE pertama yang tersimpan`,`Itulah yang dicegah transaksi: perubahan setengah jadi.`],
           [`Kembali seperti sebelum BEGIN; tidak ada perubahan yang tersimpan`,``],
           [`Kedua UPDATE tersimpan karena sudah dijalankan`,`Perubahan baru permanen setelah COMMIT.`],
           [`Database rusak dan harus dibuat ulang`,`Durability dan atomicity membuat database pulih ke kondisi konsisten terakhir.`]], answer:1,
  why:`Atomicity: transaksi yang belum di-COMMIT dibatalkan seluruhnya. 40 karung tidak akan "hilang di tengah jalan".` },
{ ch:'ubah', after:'Transaksi & ACID', type:'dml', concept:'ROLLBACK', title:'Batalkan kesalahan',
  story:`Seorang petugas magang ingin mencoba menghapus buku tamu gudang. Kamu mengajarinya memakai transaksi supaya bisa dibatalkan.`,
  task:`Mulai transaksi, hapus semua baris log_gudang, lalu batalkan dengan ROLLBACK. Datanya harus tetap utuh.`,
  explain:`Di dalam transaksi, perubahan belum permanen. ROLLBACK mengembalikan semuanya ke kondisi saat BEGIN. Biasakan memakai transaksi saat mengubah banyak data.`,
  example:`BEGIN;
DELETE FROM tabel;
ROLLBACK;`,
  hints:[`Tiga perintah: BEGIN; … ; ROLLBACK;`,`BEGIN; DELETE FROM log_gudang; ROLLBACK;`],
  solution:`BEGIN; DELETE FROM log_gudang; ROLLBACK;`,
  verify:[`SELECT COUNT(*) AS jumlah_baris FROM log_gudang`],
  vlabels:[`Jumlah baris log_gudang setelah query-mu`],
  require:[/\bbegin\b/i,/\bdelete\b/i,/\brollback\b/i], requireMsg:`Gunakan BEGIN, DELETE, lalu ROLLBACK.` },
{ ch:'ubah', after:'ROLLBACK', type:'dml', concept:'COMMIT', title:'Pisahkan catatan penjualan',
  story:`Penjualan nomor 7 (10 karung) ternyata dua transaksi terpisah: 5 karung dan 5 karung. Keduanya harus diperbaiki bersamaan.`,
  task:`Dalam satu transaksi: ubah karung penjualan id 7 menjadi 5, tambahkan penjualan baru (id 9, warga_id 4, tanggal 2026-10-16, 5 karung, harga 950000), lalu COMMIT.`,
  explain:`COMMIT menyimpan semua perubahan sejak BEGIN secara permanen. Gunakan transaksi setiap kali beberapa perubahan harus berhasil bersama: kalau satu gagal, semuanya dibatalkan.`,
  example:`BEGIN;
UPDATE ...;
INSERT ...;
COMMIT;`,
  hints:[`BEGIN; UPDATE penjualan_kopi SET karung = 5 WHERE id = 7; …`,`… INSERT INTO penjualan_kopi VALUES (9, 4, '2026-10-16', 5, 950000); COMMIT;`],
  solution:`BEGIN; UPDATE penjualan_kopi SET karung = 5 WHERE id = 7; INSERT INTO penjualan_kopi VALUES (9, 4, '2026-10-16', 5, 950000); COMMIT;`,
  verify:[`SELECT * FROM penjualan_kopi ORDER BY id`],
  vlabels:[`Isi penjualan_kopi setelah query-mu`], needWhere:true,
  require:[/\bbegin\b/i,/\bcommit\b/i], requireMsg:`Bungkus perubahan dengan BEGIN … COMMIT.` },

/* ---- struktur ---- */
{ ch:'struktur', after:'FOREIGN KEY', type:'ddl', concept:'CHECK & DEFAULT', title:'Jumlah tidak boleh nol',
  story:`Jumlah barang bukti tidak masuk akal jika 0 atau negatif, dan biasanya hanya ada 1 barang.`,
  task:`Buat tabel barang_bukti: id INTEGER PRIMARY KEY, nama_barang TEXT NOT NULL, jumlah INTEGER dengan nilai bawaan 1 dan harus lebih dari 0.`,
  explain:`DEFAULT memberi nilai bawaan jika kolom tidak diisi saat INSERT. CHECK (syarat) menolak baris yang tidak memenuhi syarat. Pengujian di bawah akan memasukkan baris tanpa jumlah, lalu mencoba jumlah 0.`,
  example:`CREATE TABLE produk (
  id    INTEGER PRIMARY KEY,
  stok  INTEGER DEFAULT 0 CHECK (stok >= 0)
);`,
  hints:[`jumlah INTEGER DEFAULT 1 CHECK (…)`,`jumlah INTEGER DEFAULT 1 CHECK (jumlah > 0)`],
  solution:`CREATE TABLE barang_bukti (id INTEGER PRIMARY KEY, nama_barang TEXT NOT NULL, jumlah INTEGER DEFAULT 1 CHECK (jumlah > 0));`,
  verify:[`INSERT INTO barang_bukti (id, nama_barang) VALUES (1, 'Uji default'); SELECT id, nama_barang, jumlah FROM barang_bukti`,
          `INSERT INTO barang_bukti (id, nama_barang, jumlah) VALUES (2, 'Uji check', 0); SELECT 'diterima' AS hasil_uji`],
  vlabels:[`Uji DEFAULT: baris tanpa jumlah`,`Uji CHECK: memasukkan jumlah 0`],
  require:[/\bcheck\b/i,/\bdefault\b/i], requireMsg:`Gunakan DEFAULT dan CHECK.` },
{ ch:'struktur', after:'CHECK & DEFAULT', type:'dml', concept:'Id otomatis', title:'Biarkan database memberi nomor',
  story:`Petugas sering salah menebak id berikutnya. Biarkan database yang memberi nomor.`,
  task:`Tambahkan laporan baru (tanggal 2026-10-23, kota Kota Lembah, jenis Kehilangan) tanpa menyebut kolom id.`,
  explain:`Kolom INTEGER PRIMARY KEY di SQLite otomatis terisi angka berikutnya jika tidak diisi. Kata AUTOINCREMENT menambah jaminan bahwa nomor bekas baris yang dihapus tidak dipakai ulang. Di MySQL namanya AUTO_INCREMENT, di PostgreSQL SERIAL atau IDENTITY.`,
  example:`INSERT INTO tabel (kolom1, kolom2)
VALUES ('a', 'b');   -- id terisi otomatis`,
  hints:[`Sebutkan hanya kolom tanggal, kota, jenis.`,`INSERT INTO laporan_polisi (tanggal, kota, jenis) VALUES ('2026-10-23', 'Kota Lembah', 'Kehilangan');`],
  solution:`INSERT INTO laporan_polisi (tanggal, kota, jenis) VALUES ('2026-10-23', 'Kota Lembah', 'Kehilangan');`,
  verify:[`SELECT id, tanggal, jenis FROM laporan_polisi ORDER BY id`],
  vlabels:[`Isi laporan_polisi setelah query-mu`],
  require:[/\binsert\b/i], requireNot:/\(\s*id\b/i, requireNotMsg:`Jangan menyebut kolom id; biarkan database mengisinya.`, requireMsg:`Gunakan INSERT.` },
{ ch:'struktur', after:'Id otomatis', type:'ddl', concept:'ON DELETE CASCADE', title:'Ikut terhapus bersama induknya',
  story:`Catatan penyidik hanya berarti selama laporannya ada. Jika laporan dicabut, catatannya harus ikut hilang.`,
  task:`Buat tabel catatan_penyidik: id INTEGER PRIMARY KEY, laporan_id INTEGER yang merujuk laporan_polisi(id) dengan ON DELETE CASCADE, dan isi TEXT.`,
  explain:`Aturan ON DELETE menentukan nasib baris anak saat induknya dihapus. CASCADE ikut menghapus anak. SET NULL mengosongkan foreign key-nya. RESTRICT (bawaan) menolak penghapusan induk selama masih punya anak. ON UPDATE bekerja serupa untuk perubahan kunci.`,
  example:`induk_id INTEGER REFERENCES induk(id)
         ON DELETE CASCADE`,
  hints:[`laporan_id INTEGER REFERENCES laporan_polisi(id) ON DELETE CASCADE`,`CREATE TABLE catatan_penyidik (id INTEGER PRIMARY KEY, laporan_id INTEGER REFERENCES laporan_polisi(id) ON DELETE CASCADE, isi TEXT);`],
  solution:`CREATE TABLE catatan_penyidik (id INTEGER PRIMARY KEY, laporan_id INTEGER REFERENCES laporan_polisi(id) ON DELETE CASCADE, isi TEXT);`,
  verify:[`SELECT "from" AS kolom, "table" AS merujuk_tabel, on_delete FROM pragma_foreign_key_list('catatan_penyidik')`,
          `INSERT INTO catatan_penyidik (id, laporan_id, isi) VALUES (1, 6, 'Cek laci balai desa'); DELETE FROM laporan_polisi WHERE id = 6; SELECT COUNT(*) AS sisa_catatan FROM catatan_penyidik`],
  vlabels:[`Aturan foreign key`,`Uji: catatan untuk laporan 6, lalu laporan 6 dihapus`],
  require:[/on\s+delete\s+cascade/i], requireMsg:`Gunakan ON DELETE CASCADE.` },
{ ch:'struktur', after:'ALTER TABLE', type:'ddl', concept:'DROP TABLE', title:'Bersihkan tabel sementara',
  setup:`CREATE TABLE tabel_sementara (id INTEGER, catatan TEXT); INSERT INTO tabel_sementara VALUES (1, 'coba-coba');`,
  extraTables:[['tabel_sementara',[['id'],['catatan']]]],
  story:`Petugas magang meninggalkan tabel_sementara berisi data coba-coba. Tabel itu harus dihapus seluruhnya.`,
  task:`Hapus tabel tabel_sementara beserta strukturnya.`,
  explain:`DROP TABLE menghapus tabel beserta seluruh isinya dan tidak bisa dibatalkan di luar transaksi. DELETE FROM hanya menghapus isi dan menyisakan strukturnya. Tambahkan IF EXISTS agar tidak error jika tabelnya tidak ada.`,
  example:`DROP TABLE IF EXISTS nama_tabel;`,
  hints:[`DROP TABLE …`,`DROP TABLE tabel_sementara;`],
  solution:`DROP TABLE tabel_sementara;`,
  verify:[`SELECT name AS tabel FROM sqlite_master WHERE type = 'table' ORDER BY name`],
  vlabels:[`Daftar tabel setelah query-mu`],
  require:[/\bdrop\s+table\b/i], requireMsg:`Gunakan DROP TABLE.` },

/* ---- optim ---- */
{ ch:'optim', type:'ddl', concept:'CREATE VIEW', title:'Query yang disimpan',
  story:`Petugas lapangan berkali-kali menulis JOIN yang sama untuk melihat kendaraan beserta pemiliknya. Simpan query itu sebagai view.`,
  task:`Buat view bernama v_kendaraan_pemilik yang berisi no_plat, merek, dan nama pemilik dari JOIN kendaraan dan warga.`,
  explain:`VIEW adalah query yang disimpan dengan nama dan bisa dipakai seperti tabel. View tidak menyimpan data sendiri; isinya selalu dihitung dari tabel aslinya. Gunanya: menyederhanakan query yang rumit dan membatasi kolom yang boleh dilihat pengguna.`,
  example:`CREATE VIEW nama_view AS
SELECT a.x, b.y
FROM a JOIN b ON ...;`,
  hints:[`CREATE VIEW v_kendaraan_pemilik AS SELECT …`,`… SELECT k.no_plat, k.merek, w.nama FROM kendaraan k JOIN warga w ON k.warga_id = w.id;`],
  solution:`CREATE VIEW v_kendaraan_pemilik AS SELECT k.no_plat, k.merek, w.nama FROM kendaraan k JOIN warga w ON k.warga_id = w.id;`,
  verify:[`SELECT name, type FROM sqlite_master WHERE name = 'v_kendaraan_pemilik'`, `SELECT * FROM v_kendaraan_pemilik`],
  vlabels:[`Objek yang terbentuk`,`Isi view`],
  require:[/\bcreate\s+view\b/i], requireMsg:`Gunakan CREATE VIEW.` },
{ ch:'optim', concept:'Memakai VIEW', title:'View seperti tabel biasa',
  setup:`CREATE VIEW v_kendaraan_pemilik AS SELECT k.no_plat, k.merek, w.nama FROM kendaraan k JOIN warga w ON k.warga_id = w.id;`,
  extraTables:[['v_kendaraan_pemilik',[['no_plat'],['merek'],['nama']]]],
  story:`View sudah tersedia. Sekarang pakai untuk mencari semua kendaraan Toyota beserta pemiliknya.`,
  task:`Dari view v_kendaraan_pemilik, tampilkan semua kolom untuk merek yang diawali Toyota.`,
  explain:`View dipakai persis seperti tabel: SELECT, WHERE, ORDER BY, bahkan JOIN. Bedanya, kamu tidak perlu menulis JOIN-nya lagi.`,
  example:`SELECT * FROM nama_view WHERE ...;`,
  hints:[`SELECT * FROM v_kendaraan_pemilik WHERE …`,`WHERE merek LIKE 'Toyota%'`],
  solution:`SELECT * FROM v_kendaraan_pemilik WHERE merek LIKE 'Toyota%';`,
  require:[/v_kendaraan_pemilik/i], requireMsg:`Ambil data dari view v_kendaraan_pemilik.` },
{ ch:'optim', type:'ddl', concept:'CREATE INDEX', title:'Mempercepat pencarian tanggal',
  story:`Buku tamu gudang akan berisi jutaan baris. Pencarian berdasarkan tanggal harus tetap cepat.`,

{ ch:'optim', type:'quiz', concept:'Untung rugi index', title:'Index bukan gratis',

✗ index: kolom jarang dicari, tabel kecil,

{ ch:'optim', concept:'SQL injection', title:'Input yang menipu',
  story:`Aplikasi pencarian warga yang lama menyusun query dengan menempelkan input pengguna:<br><code>"SELECT * FROM warga WHERE nama = '" + input + "'"</code><br>Seseorang mengetik <code>x' OR '1'='1</code> di kotak pencarian.`,
  task:`Tulis dan jalankan query yang terbentuk dari input itu, lalu lihat berapa baris yang bocor.`,
  explain:`SQL injection terjadi ketika input pengguna ditempel langsung ke teks query, sehingga input bisa mengubah perintahnya. Pencegahannya: selalu pakai parameterized query (prepared statement), misalnya "SELECT * FROM warga WHERE nama = ?" dengan input dikirim terpisah. Jangan pernah menyusun query dengan menggabungkan teks input.`,
  example:`✗ "… WHERE nama = '" + input + "'"
✓ db.prepare("… WHERE nama = ?").all(input)`,
  hints:[`Ganti input pada pola query dengan teks yang diketik penyerang.`,`SELECT * FROM warga WHERE nama = 'x' OR '1'='1';`],
  solution:`SELECT * FROM warga WHERE nama = 'x' OR '1'='1';`,
  require:[/'1'\s*=\s*'1'|1\s*=\s*1/i], requireMsg:`Gunakan persis input penyerang: x' OR '1'='1`,
  win:`Semua 12 warga bocor, karena '1'='1' selalu benar. Dengan parameterized query, input itu hanya dianggap sebagai nama yang aneh dan tidak menghasilkan apa-apa.` },
{ ch:'optim', type:'quiz', concept:'GRANT & REVOKE', title:'Hak akses petugas magang',
  story:`Petugas magang hanya boleh membaca laporan, tidak boleh mengubah apa pun.`,
  explain:`DCL mengatur siapa boleh melakukan apa. GRANT memberi hak (SELECT, INSERT, UPDATE, DELETE, ALL) pada tabel tertentu kepada pengguna atau role. REVOKE mencabutnya. Prinsip least privilege: beri hak sekecil mungkin yang masih cukup untuk bekerja. SQLite tidak punya sistem pengguna, tapi PostgreSQL, MySQL, dan SQL Server memakainya.`,
  example:`GRANT SELECT ON laporan_polisi TO magang;
REVOKE INSERT ON laporan_polisi FROM magang;`,
  q:`Perintah mana yang paling tepat untuk petugas magang?`,
  options:[[`GRANT ALL ON laporan_polisi TO magang;`,`ALL memberi hak mengubah dan menghapus juga. Itu melanggar prinsip least privilege.`],
           [`GRANT SELECT ON laporan_polisi TO magang;`,``],
           [`REVOKE SELECT ON laporan_polisi FROM magang;`,`Itu justru mencabut hak membaca.`],
           [`GRANT DELETE ON laporan_polisi TO magang;`,`DELETE adalah hak menghapus, bukan membaca.`]], answer:1,

{ ch:'rancang', type:'quiz', concept:'Kardinalitas dari cerita', title:'Di mana letak foreign key',
  story:`Kepolisian ingin mencatat petugas yang menangani setiap laporan. Aturannya: satu petugas bisa menangani banyak laporan, dan setiap laporan ditangani tepat satu petugas.`,
