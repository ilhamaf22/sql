  sintaks:{label:'Sintaks / ejaan kata kunci', tip:'Periksa ejaan kata kunci (SELECT, FROM, WHERE) dan urutannya: SELECT → FROM → JOIN → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT.', rec:'Hafalkan urutan klausa SELECT → FROM → JOIN → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT. Tulis kerangkanya dulu, baru isi detailnya.'},
  tabel:{label:'Nama tabel salah', tip:'Tabel itu tidak ada. Klik nama tabel di panel Skema supaya ejaannya pasti benar.', rec:'Biasakan mengecek skema sebelum menulis query. Nama tabel harus persis, termasuk garis bawah.'},
  kolomNama:{label:'Nama kolom salah', tip:'Kolom itu tidak ada di tabel yang kamu pakai. Cek daftar kolom di panel Skema.', rec:'Saat ragu, jalankan SELECT * FROM tabel LIMIT 1 untuk melihat nama kolom yang tersedia.'},
  kutip:{label:'Tanda kutip / kurung belum ditutup', tip:"Ada tanda kutip atau kurung yang belum ditutup. Teks ditulis dalam kutip tunggal: 'Hijau'.", rec:"Setiap teks dan tanggal diapit kutip tunggal di kedua sisi. Hitung pasangan kutip dan kurung sebelum menjalankan query."},
  ambigu:{label:'Kolom ambigu saat JOIN', tip:'Kolom ini ada di lebih dari satu tabel. Tulis awalannya, misalnya k.warga_id atau w.id.', rec:'Dalam JOIN, beri alias pendek pada tiap tabel (warga w, kendaraan k) dan selalu tulis w.kolom atau k.kolom.'},
  agregat:{label:'Salah pakai fungsi agregat', tip:'COUNT, SUM, dan sejenisnya tidak boleh di WHERE. Untuk menyaring hasil hitungan, pakai HAVING.', rec:'Bedakan WHERE (menyaring baris sebelum dikelompokkan) dan HAVING (menyaring kelompok setelah dihitung).'},
  jumlahNilai:{label:'Jumlah nilai INSERT tidak cocok', tip:'Banyaknya nilai di VALUES harus sama dengan banyaknya kolom yang disebut (atau semua kolom tabel jika tidak menyebut kolom).', rec:'Saat INSERT, selalu sebutkan daftar kolom secara eksplisit, lalu cocokkan jumlah nilainya.'},
  sudahAda:{label:'Tabel/kolom sudah ada', tip:'Nama itu sudah dipakai. Periksa apakah kamu membuat tabel atau kolom yang sudah ada.', rec:'Periksa skema sebelum CREATE atau ALTER. Nama tabel dan kolom harus unik.'},
  constraintPK:{label:'Melanggar PRIMARY KEY / UNIQUE', tip:'Nilai itu sudah dipakai baris lain di kolom yang harus unik. Gunakan nilai lain.', rec:'Cek nilai yang sudah ada (misalnya SELECT MAX(id)) sebelum menambah baris dengan id manual.'},
  constraintNN:{label:'Melanggar NOT NULL', tip:'Kolom wajib tidak boleh kosong. Pastikan kolom itu disebut dan diisi di INSERT.', rec:'Kenali kolom NOT NULL di setiap tabel dan selalu isi kolom itu saat INSERT.'},
  constraintCK:{label:'Melanggar CHECK', tip:'Nilai yang dimasukkan tidak memenuhi syarat CHECK pada kolom itu.', rec:'Baca aturan CHECK di definisi tabel sebelum memasukkan data.'},
  constraintFK:{label:'Melanggar FOREIGN KEY', tip:'Nilai foreign key menunjuk data yang tidak ada di tabel induk.', rec:'Pastikan data induk sudah ada sebelum menambah data anak yang merujuknya.'},
  errLain:{label:'Error lain', tip:'SQL menolak query ini. Baca pesan aslinya di bawah, lalu cek bagian yang disebut.', rec:'Baca pesan error sampai habis. SQLite biasanya menyebut kata tempat ia bingung.'},
  bukanTabel:{label:'Query tidak menampilkan tabel', tip:'Query berjalan tapi tidak menghasilkan tabel. Untuk tugas ini, tulis SELECT.', rec:'Bedakan perintah yang membaca data (SELECT) dan yang mengubah data (INSERT, UPDATE, DELETE).'},
  kolom:{label:'Jumlah kolom tidak sesuai', tip:'Jumlah kolom hasilmu berbeda dari yang diminta. Baca lagi kolom apa saja yang perlu ditampilkan.', rec:'Tulis kolom yang diminta satu per satu setelah SELECT. Pakai * hanya jika diminta semua kolom.'},
  urutanKolom:{label:'Urutan kolom tertukar', tip:'Isinya sudah benar, tapi urutan kolomnya berbeda. Tulis kolom sesuai urutan di tugas.', rec:'Urutan kolom di hasil mengikuti urutan penulisan di SELECT.'},
  alias:{label:'Judul kolom (alias) belum sesuai', tip:'Datanya sudah benar, tapi judul kolomnya belum sama dengan yang diminta. Gunakan AS.', rec:'Alias ditulis setelah kolom dengan AS dan dieja persis seperti yang diminta.'},
  kosong:{label:'Filter tidak menemukan data', tip:'Hasilnya kosong. Biasanya nilai di WHERE salah ketik atau beda huruf besar-kecil. Intip data aslinya dengan SELECT *.', rec:"Perbandingan = peka huruf besar-kecil: 'hijau' tidak sama dengan 'Hijau'. Intip data aslinya sebelum menulis syarat."},
  nullEq:{label:'Membandingkan NULL dengan =', tip:'= NULL tidak pernah benar, karena NULL berarti "tidak diketahui". Gunakan IS NULL atau IS NOT NULL.', rec:'Selalu pakai IS NULL / IS NOT NULL untuk memeriksa nilai kosong.'},
  lebih:{label:'Baris berlebih (filter kurang)', tip:'Hasilmu memuat baris yang tidak diminta. Ada syarat yang belum ditulis di WHERE.', rec:'Hitung berapa syarat yang disebut di soal, lalu pastikan semuanya ada di WHERE.'},
  kurang:{label:'Baris kurang (filter terlalu ketat)', tip:'Ada baris yang seharusnya muncul tapi tersaring. Cek syarat WHERE, pola LIKE, atau jenis JOIN.', rec:'Saat hasil kurang, hapus syarat satu per satu untuk melihat mana yang terlalu ketat.'},
  urutan:{label:'Urutan baris salah', tip:'Barisnya sudah benar, tapi urutannya belum. Periksa ORDER BY, ASC/DESC, dan LIMIT.', rec:'Tanpa ORDER BY, urutan hasil tidak dijamin. Tulis ORDER BY setiap kali urutan penting.'},
  isi:{label:'Isi data berbeda', tip:'Jumlah baris sama, tapi isinya berbeda. Cek kolom yang dipilih dan syarat di WHERE.', rec:'Bandingkan hasilmu dengan target baris per baris. Biasanya ada kolom yang tertukar atau syarat yang salah sasaran.'},
  dml:{label:'Perubahan data tidak sesuai', tip:'Isi tabel setelah query-mu berbeda dari yang diminta. Periksa nilai, kolom, dan baris yang kamu ubah.', rec:'Sebelum INSERT, UPDATE, atau DELETE, jalankan SELECT dengan WHERE yang sama untuk memastikan baris yang tersentuh.'},
  tanpaWhere:{label:'UPDATE/DELETE tanpa WHERE', tip:'Tanpa WHERE, perintah ini mengenai SEMUA baris tabel. Tambahkan WHERE id = ….', rec:'Jangan pernah menjalankan UPDATE atau DELETE tanpa WHERE di data sungguhan.'},
  struktur:{label:'Struktur tabel tidak sesuai', tip:'Tabel yang terbentuk berbeda dari yang diminta. Cek nama kolom, urutannya, PRIMARY KEY, NOT NULL, dan REFERENCES.', rec:'Tulis rancangan tabel (kolom, tipe, kunci) sebelum CREATE TABLE, lalu cocokkan satu per satu.'},
  tidakError:{label:'Constraint tidak teruji', tip:'Query-mu diterima database, padahal tugasnya memicu penolakan. Pastikan nilai yang kamu masukkan memang melanggar aturan.', rec:'Pahami aturan setiap constraint: PRIMARY KEY/UNIQUE menolak nilai kembar, NOT NULL menolak kosong, FOREIGN KEY menolak rujukan yang tidak ada.'},
  konsep:{label:'Konsep yang diminta belum dipakai', tip:'', rec:'Hasil benar saja belum cukup. Latih konsep yang diminta agar bisa dipakai di data yang lebih besar.'},
};

/* ===================== STATE ===================== */
const KEY='kasus-kopi-hilang-v3';
let SQL=null, EXP=[];
let S=newState();
let last=null;
function newState(){ return {screen:'cover', lvl:0, startedAt:null, finishedAt:null, mapOpen:true,
  stats:LEVELS.map(()=>({attempts:0,mistakes:0,hints:0,revealed:false,solved:false,ms:0,firstTry:false,picked:[]})),
  mistakes:[], drafts:{}, lvlStart:null }; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const t=localStorage.getItem(KEY); const d=t?JSON.parse(t):null; return d && d.stats && d.stats.length===LEVELS.length ? d : null; }catch(e){ return null; } }

/* ===================== SQL ===================== */
function exec(q, L){
  const db=new SQL.Database();
  try{
    db.run('PRAGMA foreign_keys = ON;'); db.run(SEED); if(L && L.setup) db.run(L.setup);
    let r; try{ r=db.exec(q); }catch(e){ return {ok:false, err:String(e.message||e)}; }
    const res = r.length ? r[r.length-1] : null;
    let checks=null;
    if(L && L.verify) checks=L.verify.map(v=>{
      try{ const x=db.exec(v); return x.length ? x[x.length-1] : {columns:[],values:[]}; }
      catch(e){ const m=String(e.message||e).match(/^(.*?constraint failed)/i); return {columns:['hasil_uji'], values:[[m ? 'ditolak: '+m[1].toUpperCase() : 'error: '+String(e.message||e)]]}; }
    });
    return {ok:true, res, checks};
  } finally { db.close(); }
}
const cell = v => v===null ? '∅NULL' : String(v);
const rowKey = r => r.map(cell).join('␟');
function classifyError(msg){
  const m=msg.toLowerCase();
  if(m.includes('no such table')) return 'tabel';
  if(m.includes('no such column') || m.includes('has no column named')) return 'kolomNama';
  if(m.includes('ambiguous column')) return 'ambigu';
  if(m.includes('unique constraint failed')) return 'constraintPK';
  if(m.includes('not null constraint failed')) return 'constraintNN';
  if(m.includes('foreign key constraint failed')) return 'constraintFK';
  if(m.includes('check constraint failed')) return 'constraintCK';
  if(m.includes('values were supplied') || m.includes('values for')) return 'jumlahNilai';
  if(m.includes('already exists') || m.includes('duplicate column')) return 'sudahAda';
  if(m.includes('incomplete input') || m.includes('unrecognized token') || m.includes('unterminated')) return 'kutip';
  if(m.includes('misuse of aggregate') || m.includes('aggregate')) return 'agregat';
  if(m.includes('syntax error') || m.includes('near')) return 'sintaks';
  return 'errLain';
}
function compare(u, e, orderMatters, q){
  if(!u) return /^\s*(select|with)\b/i.test(q||'') ? 'kosong' : 'bukanTabel';
  if(u.columns.length!==e.columns.length) return 'kolom';
  const ur=u.values, er=e.values;
  if(ur.length===0 && er.length>0) return 'kosong';
  const uk=ur.map(rowKey), ek=er.map(rowKey);
  if([...uk].sort().join('|')===[...ek].sort().join('|')){
    if(orderMatters && uk.join('|')!==ek.join('|')) return 'urutan';
    return null;
  }
  const flat = rs => rs.flat().map(cell).sort().join('|');
  if(ur.length===er.length && flat(ur)===flat(er)) return 'urutanKolom';
  if(ur.length>er.length) return 'lebih';
  if(ur.length<er.length) return 'kurang';
  return 'isi';
}

/* ===================== AKSI ===================== */
function startGame(){ S=newState(); S.screen='game'; S.startedAt=Date.now(); S.lvlStart=Date.now(); last=null; save(); render(); }
const curLv = () => LEVELS[S.lvl];
const freshStat = () => ({attempts:0,mistakes:0,hints:0,revealed:false,solved:false,ms:0,firstTry:false,picked:[]});
const stat = () => S.review ? S.review.st[S.lvl] : S.stats[S.lvl];
const draftKey = () => S.review ? 'r'+S.lvl : S.lvl;
function addMistake(cat, q, detail, raw){ stat().mistakes++; S.mistakes.push({lvl:S.lvl, q, cat, detail, raw, t:Date.now(), review:!!S.review}); }
function markSolved(){ const st=stat(); st.solved=true; st.ms=Date.now()-(S.lvlStart||Date.now()); st.firstTry = st.mistakes===0 && st.hints===0 && !st.revealed; }

function submit(){
  const ta=document.getElementById('sql'); const q=ta.value.trim();
  if(!q){ ta.focus(); return; }
  const L=curLv(), st=stat(); if(st.solved) return;
  st.attempts++;
  const r=exec(q, L);
  const type=L.type||'query';
  let cat=null, detail='', raw='';
  if(!r.ok){
    raw=r.err;
    if(type==='error' && L.expectErr.test(r.err) && (!L.require || L.require.every(x=>x.test(q)))) cat=null;
    else {
      cat=classifyError(r.err);
      const near=r.err.match(/near "([^"]*)"/i); if(near) detail = near[1] ? `SQL bingung di dekat «${near[1]}».` : 'Query terpotong sebelum selesai.';
      const col=r.err.match(/no such column: (\S+)/i); if(col) detail=`Kolom «${col[1]}» tidak dikenal.`;
      const tb=r.err.match(/no such table: (\S+)/i); if(tb) detail=`Tabel «${tb[1]}» tidak ada.`;
      if(type==='error' && /constraint failed/i.test(r.err)) detail='Database memang menolak, tapi karena aturan yang lain. Baca lagi tugasnya.';
    }
  } else if(type==='error'){
    cat='tidakError';
  } else if(type==='dml' || type==='ddl'){
    for(let i=0;i<L.verify.length;i++){
      const c=compare(r.checks[i], EXP[S.lvl][i], true, 'select');
      if(c){ cat = type==='ddl' ? 'struktur' : 'dml'; detail='Perbedaannya: '+CATS[c].label.toLowerCase()+'.'; break; }
    }
    if(cat && L.needWhere && !/\bwhere\b/i.test(q)){ cat='tanpaWhere'; detail=''; }
    if(!cat && L.require && !L.require.every(x=>x.test(q))) cat='konsep';
  } else {
    cat=compare(r.res, EXP[S.lvl], L.orderMatters, q);
    if(cat==='kosong' && /(=|<>|!=)\s*null\b/i.test(q)) cat='nullEq';
    if(!cat && L.checkNames){ const a=r.res.columns.map(c=>c.toLowerCase()).join(','), b=EXP[S.lvl].columns.map(c=>c.toLowerCase()).join(','); if(a!==b){ cat='alias'; detail=`Judul kolommu: ${r.res.columns.join(', ')}. Yang diminta: ${EXP[S.lvl].columns.join(', ')}.`; } }
    if(!cat && L.require && !L.require.every(x=>x.test(q))) cat='konsep';
    if(cat==='kolom') detail=`Hasilmu ${r.res.columns.length} kolom, yang diminta ${EXP[S.lvl].columns.length} kolom.`;
    if(cat==='lebih'||cat==='kurang') detail=`Hasilmu ${r.res.values.length} baris, targetnya ${EXP[S.lvl].values.length} baris.`;
  }
  if(!cat && L.requireNot && L.requireNot.test(q)){ cat='konsep'; }
  if(cat==='konsep') detail = (L.requireNot && L.requireNot.test(q) && L.requireNotMsg) ? L.requireNotMsg : L.requireMsg;
  last={q, r, cat, detail, raw};
  if(cat) addMistake(cat, q, detail, raw); else markSolved();
  S.drafts[draftKey()]=q; save(); render(true);
}
function pick(i){
  const L=curLv(), st=stat(); if(st.solved || st.picked.includes(i)) return;
  st.attempts++; st.picked.push(i);
  if(i===L.answer){ last={quiz:true, ok:true}; markSolved(); }
  else { last={quiz:true, ok:false, i}; addMistake('teori', L.options[i][0], `${L.concept}: memilih «${L.options[i][0]}»`, ''); }
  save(); render(true);
}
function useHint(){ const st=stat(), L=curLv(); if(L.exam) return; const n=L.type==='quiz'?1:L.hints.length; if(st.hints<n){ st.hints++; save(); render(); } }
function reveal(){ const st=stat(); if(curLv().exam) return; st.revealed=true; S.drafts[draftKey()]=curLv().solution; save(); render(); }
function goto(i){ last=null; S.lvl=i; S.lvlStart=Date.now(); save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function startReview(queue){ if(!queue.length) return; S.review={queue, pos:0, st:{}}; queue.forEach(i=>S.review.st[i]=freshStat()); queue.forEach(i=>delete S.drafts['r'+i]); S.screen='game'; last=null; goto(queue[0]); }
function endReview(){ if(S.review) S.lastReview={queue:S.review.queue, st:S.review.st}; S.review=null; finish(); }
function nextLevel(){
  if(S.review){ S.review.pos++; if(S.review.pos<S.review.queue.length) goto(S.review.queue[S.review.pos]); else endReview(); return; }
  const n=S.stats.findIndex((s,i)=>i>S.lvl && !s.solved);
  if(n>-1) goto(n); else { const a=S.stats.findIndex(s=>!s.solved); if(a>-1) goto(a); else finish(); }
}
function finish(){ last=null; S.screen='eval'; S.finishedAt=Date.now(); save(); render(); window.scrollTo({top:0}); }
function insert(text){
  const ta=document.getElementById('sql'); if(!ta || ta.readOnly) return;
  const s=ta.selectionStart, e=ta.selectionEnd;
  ta.value=ta.value.slice(0,s)+text+ta.value.slice(e); ta.selectionStart=ta.selectionEnd=s+text.length; ta.focus(); S.drafts[draftKey()]=ta.value;
}

/* ===================== RENDER BANTU ===================== */
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtTime = ms => { const s=Math.max(0,Math.round(ms/1000)); const m=Math.floor(s/60); return `${m}:${String(s%60).padStart(2,'0')}`; };
const app = () => document.getElementById('app');
const solvedCount = () => S.stats.filter(s=>s.solved).length;

function tableHTML(res){
  if(!res || !res.columns.length) return '<div class="empty">Tidak ada baris yang ditampilkan (0 baris).</div>';
  if(!res.values.length) return `<div class="empty">0 baris. Kolom: ${res.columns.map(esc).join(', ')}</div>`;
  return `<table><thead><tr>${res.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${
    res.values.map(r=>`<tr>${r.map(v=>v===null?'<td class="null">NULL</td>':`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function mapHTML(){
  return `<details class="map" id="map" ${S.mapOpen?'open':''}>
    <summary>Peta materi · ${CHAPTERS.length} bab, ${LEVELS.length} level<span>klik nomor untuk pindah level kapan saja</span></summary>
    <div class="chapters">${CHAPTERS.map((c,ci)=>{
      const idx=LEVELS.map((l,i)=>[l,i]).filter(([l])=>l.ch===ci);
      const done=idx.filter(([,i])=>S.stats[i].solved).length;
      return `<div class="ch"><div class="t"><span class="no">BAB ${ci+1}</span>${esc(c.n)}<span class="pc">${done}/${idx.length}</span></div>
        <div class="dots">${idx.map(([l,i])=>{ const s=S.stats[i];
          const cls=[s.solved?(s.revealed?'helped':'done'):(s.mistakes?'tried':''), i===S.lvl?'now':''].join(' ');
          return `<button class="dot ${cls}" data-go="${i}" title="${esc(l.concept)}" aria-label="Level ${i+1}: ${esc(l.concept)}">${i+1}</button>`; }).join('')}</div></div>`;
    }).join('')}</div></details>`;
}

  app().innerHTML=`
  <div class="top"><div><span class="case-no">DIVISI DATA KRIMINAL · KOTA LEMBAH</span><h1>Kasus Kopi Hilang</h1></div></div>
  <section class="cover">
    <div style="display:flex;flex-direction:column;gap:18px;min-width:0">

      <p class="lead">Kamu analis data baru di kepolisian Kota Lembah. Pelajari cara kerja database dari nol, pakai SQL untuk melacak pelakunya, lalu bangun sendiri tabel untuk mencatat barang buktinya.</p>
      <ul class="syll">${CHAPTERS.map((c,i)=>`<li><span class="no">BAB ${i+1} · ${LEVELS.filter(l=>l.ch===i).length} level</span><b>${esc(c.n)}</b>${esc(c.d)}</li>`).join('')}</ul>
      <div class="row">
        <button class="btn red" id="start">${canResume?'Mulai ulang dari awal':'Mulai penyelidikan'}</button>
        ${canResume?`<button class="btn" id="resume">Lanjutkan (${saved.stats.filter(s=>s.solved).length}/${LEVELS.length} selesai)</button>`:''}
        <button class="btn ghost" id="sbxCover">Buka sandbox</button>
      </div>
    </div>
    <aside class="how">
      <span class="label">Cara bermain</span>
      <ol>
        <li>Materi teori dijawab lewat kuis, lengkap dengan diagram relasinya. Materi SQL dikerjakan di database sungguhan yang berjalan di browsermu. Jalankan query dengan tombol atau <span class="kbd">Ctrl</span> + <span class="kbd">Enter</span>.</li>

        <li>Bab terakhir adalah ujian tanpa petunjuk. Setelah evaluasi, kamu bisa mengulang otomatis level yang paling sering salah.</li>

}

/* ===================== SANDBOX ===================== */
let SBX=null, sbxLast=null;
function sbxReset(){ if(SBX) SBX.close(); SBX=new SQL.Database(); SBX.run('PRAGMA foreign_keys = ON;'); SBX.run(SEED); SBX.run(ARSIP); sbxLast=null; }
function openSandbox(){ S.prevScreen=S.screen==='sandbox'?S.prevScreen:S.screen; S.screen='sandbox'; if(!SBX) sbxReset(); save(); render(); window.scrollTo({top:0}); }
function sbxTables(){
  const r=SBX.exec("SELECT name, type FROM sqlite_master WHERE type IN ('table','view') AND name NOT LIKE 'sqlite_%' ORDER BY type, name");
  if(!r.length) return [];
  return r[0].values.map(([n,t])=>{ const c=SBX.exec(`SELECT name, pk FROM pragma_table_info('${n.replace(/'/g,"''")}')`); return [n, c.length?c[0].values.map(([cn,pk])=>[cn, pk?'P':'']):[], t]; });
}
function sbxRun(){
  const ta=document.getElementById('sbx'); const q=ta.value.trim(); if(!q) return;
  S.sbxDraft=ta.value; save();
  try{ const r=SBX.exec(q); sbxLast={ok:true, res:r, ch:SBX.getRowsModified()}; }
  catch(e){ const m=String(e.message||e); sbxLast={ok:false, err:m, cat:classifyError(m)}; }
  renderSandbox();
}
function renderSandbox(){
  const tabs=sbxTables();
  let out='';
  if(sbxLast){
    if(!sbxLast.ok){ const c=CATS[sbxLast.cat]; out=`<div class="feedback bad"><div class="head"><span class="cat">ERROR</span>${esc(c.label)}</div><p>${esc(c.tip)}</p><p class="raw">Pesan SQLite: ${esc(sbxLast.err)}</p></div>`; }
    else if(!sbxLast.res.length) out=`<div class="feedback good"><div class="head"><span class="cat">OK</span>Perintah dijalankan.</div><p>${sbxLast.ch} baris berubah.</p></div>`;
    else out=sbxLast.res.map((r,i)=>`<span class="label">Hasil ${sbxLast.res.length>1?'#'+(i+1)+' · ':''}${r.values.length} baris</span><div class="result">${tableHTML(r)}</div>`).join('');
  }
  app().innerHTML=`
  <div class="top"><div><span class="case-no">SANDBOX · TIDAK DINILAI</span><h1>Kasus Kopi Hilang</h1></div>
    <div class="meta"><button class="btn sm" id="sbxBack">← Kembali</button></div></div>
  <div class="game">
    <article class="folder" data-tab="SANDBOX">
      <h2>Ruang coba bebas</h2>
      <p>Tulis query apa saja ke salinan database kasus. Di sini kamu boleh membuat, mengubah, dan menghapus apa pun. Tidak ada yang dinilai dan tidak ada yang dicatat sebagai kesalahan.</p>
      <div class="concept"><span class="label">Ide untuk dicoba</span><pre>SELECT * FROM arsip_kendaraan;
SELECT jenis, COUNT(*) FROM kendaraan GROUP BY jenis;
CREATE TABLE coba (id INTEGER PRIMARY KEY, isi TEXT);
INSERT INTO coba (isi) VALUES ('halo');
SELECT * FROM coba;</pre></div>
      <p class="target">Perubahan bertahan selama halaman terbuka. Tekan "Reset database" untuk kembali ke data awal.</p>
    </article>
    <div class="desk">
      <section class="panel">
        <span class="label">Tabel & view saat ini · klik untuk menyisipkan</span>
        <div class="schema">${tabs.map(([t,cs,ty])=>`<div class="tbl"><button data-ins="${esc(t)}">${esc(t)}</button>${ty==='view'?' <span class="target">view</span>':''}<div class="cols">${cs.map(([c,k])=>`<button class="${k==='P'?'k':''}" data-ins="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>`).join('')}</div>
      </section>
      <section class="panel">
        <label class="label" for="sbx">Query bebas</label>
        <textarea id="sbx" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="SELECT …">${esc(S.sbxDraft||'')}</textarea>
        <div class="row"><button class="btn red" id="sbxRun">Jalankan <span class="kbd">Ctrl+Enter</span></button><button class="btn ghost" id="sbxReset">Reset database</button></div>
        ${out}
      </section>
      <details class="panel"><summary>Diagram relasi database (ERD)</summary><div class="erd">${erdSVG()}</div></details>
    </div>

  const ta=document.getElementById('sbx');
  ta.addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); sbxRun(); } if(e.key==='Tab' && !e.shiftKey){ e.preventDefault(); const s0=ta.selectionStart; ta.value=ta.value.slice(0,s0)+'  '+ta.value.slice(ta.selectionEnd); ta.selectionStart=ta.selectionEnd=s0+2; } });
  ta.addEventListener('input', ()=>{ S.sbxDraft=ta.value; save(); });
  document.getElementById('sbxRun').onclick=sbxRun;
  document.getElementById('sbxReset').onclick=()=>{ sbxReset(); renderSandbox(); };
  document.getElementById('sbxBack').onclick=()=>{ S.screen=S.prevScreen||'cover'; if(S.screen==='sandbox') S.screen='cover'; save(); render(); };
  document.querySelectorAll('[data-ins]').forEach(b=>b.onclick=()=>{ const s0=ta.selectionStart; const t=b.dataset.ins; ta.value=ta.value.slice(0,s0)+t+ta.value.slice(ta.selectionEnd); ta.selectionStart=ta.selectionEnd=s0+t.length; ta.focus(); });
}

/* ===================== EVALUASI ===================== */
function evaluation(){
  const st=S.stats;
  const scores=st.map(s => !s.solved ? 0 : s.revealed ? 20 : Math.max(30, 100 - s.mistakes*15 - s.hints*10));
  const total=scores.reduce((a,b)=>a+b,0), max=LEVELS.length*100, pct=Math.round(total/max*100);
  const solved=st.filter(s=>s.solved).length;
  const grade = pct>=90?'A':pct>=78?'B':pct>=62?'C':pct>=45?'D':'E';
  const title = {A:'Detektif Kepala',B:'Penyidik Andal',C:'Penyidik Muda',D:'Analis Magang',E:'Kadet Data'}[grade];
  const note = solved<LEVELS.length
    ? `Kamu sudah menyelesaikan ${solved} dari ${LEVELS.length} level. Level yang belum dikerjakan bernilai 0, jadi nilai ini akan naik saat kamu melanjutkan.`
    : {A:'Query-mu rapi dan tepat sasaran, dan konsep database-mu kuat. Kamu siap untuk window function, index, dan transaksi.',
       B:'Dasar SQL dan database-mu kuat. Ada beberapa pola kesalahan kecil yang masih berulang; lihat saran di bawah.',
       C:'Alur berpikirmu sudah benar, tapi beberapa konsep masih perlu dilatih agar tidak tersandung lagi.',
       D:'Seluruh materi selesai dengan cukup banyak bantuan. Ulangi bab yang berwarna merah untuk menguatkan dasar.',
       E:'Ini baru permulaan. Fokus pada Bab 1–3 dulu, lalu main lagi.'}[grade];
  const MS=S.mistakes.filter(m=>!m.review);
  const counts={}; MS.forEach(m=>counts[m.cat]=(counts[m.cat]||0)+1);
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const maxC=sorted.length?sorted[0][1]:1;
  const chap=CHAPTERS.map((c,ci)=>{ const idx=LEVELS.map((l,i)=>i).filter(i=>LEVELS[i].ch===ci);
    const p=idx.reduce((a,i)=>a+scores[i],0)/(idx.length*100)*100; const d=idx.filter(i=>st[i].solved).length;
    return {n:c.n, p:Math.round(p), d, t:idx.length}; });
  const recs=[];
  const teoriTopics=[...new Set(MS.filter(m=>m.cat==='teori').map(m=>LEVELS[m.lvl].concept))];
  sorted.slice(0,4).forEach(([c])=>{
    if(c==='teori') recs.push(`Baca ulang kotak konsep untuk topik teori: ${teoriTopics.join(', ')}. Coba jelaskan dengan kata-katamu sendiri memakai contoh tabel kasus ini.`);
    else recs.push(CATS[c].rec);
  });
  const weakCh=chap.filter(c=>c.d>0 && c.p<60).map(c=>c.n);
  if(weakCh.length) recs.push(`Ulangi bab ${weakCh.join(', ')} dan tulis setiap query dari nol tanpa petunjuk.`);
  const unfinished=chap.filter(c=>c.d<c.t).map(c=>c.n);
  if(unfinished.length) recs.push(`Selesaikan bab yang belum tuntas: ${unfinished.join(', ')}.`);
  if(!recs.length) recs.push('Tidak ada pola kesalahan. Tantang dirimu dengan window function (ROW_NUMBER, RANK), CTE (WITH), dan index.');
  const firstTry=st.filter(s=>s.firstTry).length;
  const totalMs=(S.finishedAt||Date.now())-(S.startedAt||Date.now());
  const hints=st.reduce((a,s)=>a+s.hints,0);
  const examIdx=LEVELS.map((l,i)=>i).filter(i=>LEVELS[i].exam);
  const examPct=Math.round(examIdx.reduce((a,i)=>a+scores[i],0)/(examIdx.length*100)*100);
  const examDone=examIdx.filter(i=>st[i].solved).length;
  const weak=LEVELS.map((l,i)=>i).filter(i=>!LEVELS[i].exam && (st[i].revealed || st[i].mistakes>=2));
  return {scores,total,max,pct,grade,title,note,sorted,maxC,chap,recs,firstTry,totalMs,hints,solved,MS,examPct,examDone,examN:examIdx.length,weak};
}

      <div class="stat"><span class="label">Level selesai</span><div class="v">${v.solved}/${LEVELS.length}</div><span class="target">${v.firstTry} tepat sekali coba</span></div>
      <div class="stat"><span class="label">Kesalahan</span><div class="v">${v.MS.length}</div><span class="target">${v.sorted.length} jenis berbeda · ${v.hints} petunjuk</span></div>
      <div class="stat"><span class="label">Nilai ujian akhir</span><div class="v">${v.examDone?v.examPct+'%':'–'}</div><span class="target">${v.examDone}/${v.examN} soal · waktu total ${fmtTime(v.totalMs)}</span></div>
    </div>
    <div class="grid2">
      <section class="panel">
        <h3 style="font-size:1.2rem">Penguasaan per bab</h3>
        <div class="bars">${v.chap.map(c=>`<div class="bar"><span>${esc(c.n)} <span class="target">(${c.d}/${c.t})</span></span><div class="track2"><div class="fill ${col(c.p)}" style="width:${c.p}%"></div></div><span class="num">${c.p}%</span></div>`).join('')}</div>
        <p class="target">Hijau ≥ 75% · kuning 50–74% · merah di bawah 50%.</p>
      </section>
      <section class="panel">
        <h3 style="font-size:1.2rem">Pola kesalahanmu</h3>
        ${v.sorted.length?`<div class="bars">${v.sorted.map(([c,n],i)=>`<div class="bar ${i===0?'top':''}"><span>${esc(CATS[c].label)}</span><div class="track2"><div class="fill" style="width:${n/v.maxC*100}%"></div></div><span class="num">${n}</span></div>`).join('')}</div>`
          :'<p class="target">Tidak ada kesalahan sama sekali.</p>'}
      </section>
    </div>
    <section class="panel">
      <h3 style="font-size:1.2rem">Saran latihan berikutnya</h3>
      <ol class="recs">${v.recs.map(r=>`<li>${esc(r)}</li>`).join('')}</ol>
      ${v.weak.length?`<div class="row"><button class="btn" id="review">Latihan ulang ${v.weak.length} level yang lemah</button><span class="target">Level dengan 2+ kesalahan atau yang jawabannya dibuka, dikerjakan ulang dari nol.</span></div>`:''}
      ${S.lastReview?(()=>{ const q=S.lastReview.queue, rs=S.lastReview.st; const ok=q.filter(i=>rs[i].solved && !rs[i].revealed && rs[i].mistakes===0).length; const done=q.filter(i=>rs[i].solved).length;
        return `<div class="concept"><span class="label">Hasil latihan ulang terakhir</span><p>${done} dari ${q.length} level diselesaikan, ${ok} di antaranya langsung benar tanpa kesalahan.</p>
        <p class="target">${q.map(i=>`L${i+1} ${esc(LEVELS[i].concept)}: ${rs[i].solved?(rs[i].mistakes?rs[i].mistakes+' salah':'langsung benar'):'belum selesai'}`).join(' · ')}</p></div>`; })():''}
    </section>
    <section class="panel">
      <h3 style="font-size:1.2rem">Rincian per level</h3>
      <div class="result" style="max-height:480px"><table>
        <thead><tr><th>Lvl</th><th>Bab</th><th>Konsep</th><th>Percobaan</th><th>Salah</th><th>Petunjuk</th><th>Waktu</th><th>Poin</th><th>Status</th></tr></thead>
        <tbody>${S.stats.map((s,i)=>`<tr><td>${i+1}</td><td>${LEVELS[i].ch+1}</td><td>${esc(LEVELS[i].concept)}</td><td>${s.attempts}</td><td>${s.mistakes}</td><td>${s.hints}</td><td>${s.solved?fmtTime(s.ms):'–'}</td><td>${v.scores[i]}</td><td>${statusOf(s)}</td></tr>`).join('')}</tbody>
      </table></div>
      <p class="target">Poin per level: 100, dikurangi 15 tiap kesalahan dan 10 tiap petunjuk (minimal 30). Level yang jawabannya ditampilkan bernilai 20, dan level yang belum selesai bernilai 0.</p>
    </section>
    <section class="panel">
      ${S.mistakes.length?`<details>
        <summary>Log lengkap ${S.mistakes.length} kesalahan (↻ = saat latihan ulang)</summary>
        <div class="result" style="margin-top:12px;max-height:420px"><table>
          <thead><tr><th>Lvl</th><th>Jenis</th><th>Jawaban / query</th><th>Keterangan</th></tr></thead>
          <tbody>${S.mistakes.map(m=>`<tr><td>${m.lvl+1}${m.review?'↻':''}</td><td>${esc(CATS[m.cat].label)}</td><td class="mono">${esc(m.q.replace(/\s+/g,' '))}</td><td>${esc(m.detail||m.raw||'')}</td></tr>`).join('')}</tbody>
        </table></div>
      </details>`:''}
      <div class="row">
        <button class="btn red" id="again">Main lagi dari awal</button>
        <button class="btn ghost" id="copy">Salin ringkasan evaluasi</button>
        <span class="target" id="copied" aria-live="polite"></span>
      </div>
    </section>
    ${promoHTML()}
  </div>`;
  document.getElementById('again').onclick=startGame;
  const rvb=document.getElementById('review'); if(rvb) rvb.onclick=()=>startReview(v.weak);
  document.getElementById('evSbx').onclick=openSandbox;
  document.getElementById('back').onclick=()=>{ S.screen='game'; S.finishedAt=null; const i=S.stats.findIndex(s=>!s.solved); goto(i>-1?i:S.lvl); };
  document.getElementById('copy').onclick=()=>{
    const txt=`Kasus Kopi Hilang — Evaluasi Belajar SQL\nNilai: ${v.grade} (${v.title}), skor ${v.pct}%\nLevel selesai: ${v.solved}/${LEVELS.length} · Kesalahan: ${v.MS.length} · Nilai ujian: ${v.examDone?v.examPct+'%':'-'} · Tepat sekali coba: ${v.firstTry} · Petunjuk: ${v.hints} · Waktu: ${fmtTime(v.totalMs)}\n\nPenguasaan per bab:\n${v.chap.map(c=>`- ${c.n}: ${c.p}% (${c.d}/${c.t})`).join('\n')}\n\nPola kesalahan:\n${v.sorted.map(([c,n])=>`- ${CATS[c].label}: ${n}`).join('\n')||'- tidak ada'}\n\nSaran:\n${v.recs.map((r,i)=>`${i+1}. ${r}`).join('\n')}`;
    const done=ok=>document.getElementById('copied').textContent = ok?'Tersalin.':'Gagal menyalin otomatis.';
    try{ navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false)); }catch(e){ done(false); }
  };
}

function render(justRan){
  renderCredits();
  if(S.screen==='cover') renderCover();
  else if(S.screen==='game') renderGame(justRan);
  else if(S.screen==='sandbox'){ if(!SBX) sbxReset(); renderSandbox(); }
  else renderEval();
}

/* ===================== BOOT ===================== */
window.claude?.hot?.snapshot?.(() => S);
function boot(data){
  if(data && data.screen && data.stats && data.stats.length===LEVELS.length) S=data;
  if(typeof initSqlJs!=='function'){ app().innerHTML='<div class="loading">Mesin SQL gagal dimuat. Muat ulang halaman ini.</div>'; return; }
  initSqlJs().then(lib=>{
    SQL=lib;
    EXP=LEVELS.map(L=>{ const t=L.type||'query'; if(t==='quiz'||t==='error') return null; const r=exec(L.solution,L); return (t==='dml'||t==='ddl') ? r.checks : r.res; });
    render();
  }).catch(()=>{ app().innerHTML='<div class="loading">Mesin SQL gagal dimuat. Muat ulang halaman ini.</div>'; });
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
